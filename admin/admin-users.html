<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story.fun | 用户管理</title>
  <link rel="stylesheet" href="admin-shared.css" />
</head>
<body>

  <div id="admin-sidebar-placeholder"></div>

  <div class="app-shell">
    <div class="page-header">
      <div>
        <h1>👥 用户管理</h1>
        <div class="sub">注册用户 · NFT 持有 / 创作者 / 发布者构成，用户明细支持排序与区间筛选</div>
      </div>
    </div>

    <!-- ── Tab 切换 ── -->
    <div class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="overview" onclick="switchTab('overview')">用户概览</button>
      <button class="tab-btn" data-tab="list" onclick="switchTab('list')">用户列表</button>
    </div>

    <!-- ════════ Tab 1: 用户概览 ════════ -->
    <div class="tab-panel active" id="panel-overview">
      <div class="stat-grid">
        <div class="stat-card accent">
          <span class="stat-ico">👥</span>
          <div class="stat-label">注册用户数</div>
          <div class="stat-value" id="ovTotal"></div>
          <div class="stat-sub">近 7 天新增 <b id="ovNew7" style="color:#05DF72;"></b> · 近 30 天新增 <b id="ovNew30" style="color:#05DF72;"></b></div>
        </div>
        <div class="stat-card">
          <span class="stat-ico">🖼️</span>
          <div class="stat-label">NFT 持有者数量</div>
          <div class="stat-value" id="ovHolder"></div>
          <div class="stat-ratio" id="ovHolderPct"></div>
          <div class="stat-sub">当前持有 ≥1 个 NFT 的用户</div>
        </div>
        <div class="stat-card">
          <span class="stat-ico">✍️</span>
          <div class="stat-label">创作者数量</div>
          <div class="stat-value" id="ovCreator"></div>
          <div class="stat-ratio" id="ovCreatorPct"></div>
          <div class="stat-sub">发布过内容的用户</div>
        </div>
        <div class="stat-card">
          <span class="stat-ico">🏛️</span>
          <div class="stat-label">NFT 发布者数量</div>
          <div class="stat-value" id="ovPublisher"></div>
          <div class="stat-ratio" id="ovPublisherPct"></div>
          <div class="stat-sub">发行过 IP（创建过 NFT）的用户</div>
        </div>
      </div>

      <div class="section-card">
        <div class="card-title">用户构成明细<span class="hint">占比 = 各类人数 ÷ 注册用户数</span></div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>类型</th><th>定义</th><th>人数</th><th>占比</th><th style="width:38%;">占比可视化</th></tr>
            </thead>
            <tbody id="ovDetailBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ════════ Tab 2: 用户列表 ════════ -->
    <div class="tab-panel" id="panel-list">
      <div class="filter-bar" id="filterBar">
        <div class="filter-group">
          <label>UID</label>
          <input type="number" id="fUid" placeholder="精确 UID" style="width:120px;" />
        </div>
        <div class="filter-group">
          <label>用户名（模糊）</label>
          <input type="text" id="fName" placeholder="如 luna" style="width:130px;" />
        </div>
        <div class="filter-group">
          <label>钱包地址（模糊）</label>
          <input type="text" id="fAddr" placeholder="0x…" style="width:170px;" />
        </div>
        <div class="filter-group">
          <label>注册时间</label>
          <div class="filter-inline">
            <input type="date" id="fRegA" /><span class="sep">~</span>
            <input type="date" id="fRegB" />
          </div>
        </div>
        <div class="filter-group">
          <label>持有 NFT 数量</label>
          <div class="filter-inline">
            <input type="number" id="fNftA" min="0" placeholder="≥" style="width:64px;" /><span class="sep">~</span>
            <input type="number" id="fNftB" min="0" placeholder="≤" style="width:64px;" />
          </div>
        </div>
        <div class="filter-group">
          <label>NFT 总算力（积分/时）</label>
          <div class="filter-inline">
            <input type="number" id="fPowA" min="0" placeholder="≥" style="width:76px;" /><span class="sep">~</span>
            <input type="number" id="fPowB" min="0" placeholder="≤" style="width:76px;" />
          </div>
        </div>
        <div class="filter-group">
          <label>Story 产出（累计）</label>
          <div class="filter-inline">
            <input type="number" id="fProA" min="0" placeholder="≥" style="width:76px;" /><span class="sep">~</span>
            <input type="number" id="fProB" min="0" placeholder="≤" style="width:76px;" />
          </div>
        </div>
        <div class="filter-group">
          <label>Story 提取（累计）</label>
          <div class="filter-inline">
            <input type="number" id="fExtA" min="0" placeholder="≥" style="width:76px;" /><span class="sep">~</span>
            <input type="number" id="fExtB" min="0" placeholder="≤" style="width:76px;" />
          </div>
        </div>
        <button class="btn-sm" onclick="doSearch()" style="margin-left:auto;">🔍 查询</button>
        <button class="btn-reset" onclick="resetFilters()">↺ 重置</button>
      </div>

      <div class="section-card">
        <div class="card-title">用户列表
          <span class="hint" id="listTotal"></span>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th class="sortable num" data-k="uid" onclick="sortBy('uid')" style="min-width:96px;">UID<span class="arrow"></span></th>
                <th>用户名</th>
                <th style="min-width:185px;">钱包地址</th>
                <th class="sortable" data-k="regTs" onclick="sortBy('regTs')">注册时间<span class="arrow"></span></th>
                <th class="sortable" data-k="activeTs" onclick="sortBy('activeTs')">最后活跃<span class="arrow"></span></th>
                <th class="sortable num" data-k="nftCount" onclick="sortBy('nftCount')">持有NFT<span class="arrow"></span></th>
                <th class="sortable num" data-k="power" onclick="sortBy('power')">NFT总算力<span class="arrow"></span></th>
                <th class="sortable num" data-k="storyProduced" onclick="sortBy('storyProduced')">Story产出<span class="arrow"></span></th>
                <th class="sortable num" data-k="storyExtracted" onclick="sortBy('storyExtracted')">Story提取<span class="arrow"></span></th>
              </tr>
            </thead>
            <tbody id="userBody"></tbody>
          </table>
        </div>
        <div class="empty-state" id="userEmpty" style="display:none;">
          <div class="big">🔍</div>
          没有符合筛选条件的用户
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>

  <script src="load-admin-sidebar.js"></script>
  <script src="admin-mock-data.js"></script>
  <script>
    (function () {
      'use strict';
      var M = window.SFMock;
      var helpers = M.helpers;
      var fmtNum = helpers.fmtNum, fmtTs = helpers.fmtTs, pct = helpers.pct;

      // ── Tab 切换 ──
      window.switchTab = function (name) {
        document.querySelectorAll('.tab-btn').forEach(function (b) {
          b.classList.toggle('active', b.getAttribute('data-tab') === name);
        });
        document.querySelectorAll('.tab-panel').forEach(function (p) {
          p.classList.toggle('active', p.id === 'panel-' + name);
        });
      };

      // ── 概览 ──
      function renderOverview() {
        var total = M.users.length;
        var holders = M.users.filter(function (u) { return u.nftCount > 0; }).length;
        var creators = M.users.filter(function (u) { return u.isCreator; }).length;
        var publishers = M.users.filter(function (u) { return u.isNftPublisher; }).length;
        var now = M.NOW;
        var d30 = now - 30 * M.DAY, d7 = now - 7 * M.DAY;
        var n7 = 0, n30 = 0;
        M.users.forEach(function (u) {
          if (u.regTs >= d7) n7++;
          if (u.regTs >= d30) n30++;
        });
        document.getElementById('ovTotal').textContent = fmtNum(total);
        document.getElementById('ovNew7').textContent = '+' + fmtNum(n7);
        document.getElementById('ovNew30').textContent = '+' + fmtNum(n30);
        document.getElementById('ovHolder').textContent = fmtNum(holders);
        document.getElementById('ovHolderPct').textContent = pct(holders, total);
        document.getElementById('ovCreator').textContent = fmtNum(creators);
        document.getElementById('ovCreatorPct').textContent = pct(creators, total);
        document.getElementById('ovPublisher').textContent = fmtNum(publishers);
        document.getElementById('ovPublisherPct').textContent = pct(publishers, total);

        var rows = [
          { icon: '🖼️', name: 'NFT 持有者', def: '当前持有 ≥1 个 NFT 的用户', n: holders },
          { icon: '✍️', name: '创作者', def: '发布过内容的用户', n: creators },
          { icon: '🏛️', name: 'NFT 发布者', def: '发行过 IP（创建过 NFT）的用户', n: publishers }
        ];
        // 纯用户：精确集合（未持有 NFT 且未发布内容且未发行 IP）
        var pure = M.users.filter(function (u) { return u.nftCount === 0 && !u.isCreator && !u.isNftPublisher; }).length;
        rows.push({ icon: '👤', name: '纯用户', def: '未持有 NFT、未发布内容的注册用户', n: pure });
        document.getElementById('ovDetailBody').innerHTML = rows.map(function (r) {
          var rp = pct(r.n, total);
          var width = (r.n / total * 100).toFixed(1);
          return '<tr>' +
            '<td><strong>' + r.icon + ' ' + r.name + '</strong></td>' +
            '<td class="weak">' + r.def + '</td>' +
            '<td class="num" style="font-weight:700;">' + fmtNum(r.n) + '</td>' +
            '<td><span class="tag-pct">' + rp + '</span></td>' +
            '<td><div class="ratio-track"><div class="fill" style="width:' + Math.min(100, width) + '%;"></div></div></td>' +
            '</tr>';
        }).join('');
      }

      // ── 列表：状态 ──
      var state = { sortKey: 'regTs', sortDir: -1, page: 1 };
      var PAGE_SIZE = 20;
      var SORT_META = {
        regTs: { label: '注册时间', num: false },
        activeTs: { label: '最后活跃', num: false },
        nftCount: { label: '持有NFT', num: true },
        power: { label: 'NFT总算力', num: true },
        storyProduced: { label: 'Story产出', num: true },
        storyExtracted: { label: 'Story提取', num: true }
      };

      function numVal(v, dft) { return (v === '' || v == null) ? dft : Number(v); }
      function dateVal(v) {
        if (!v) return null;
        var p = v.split('-');
        return Date.UTC(+p[0], +p[1] - 1, +p[2]);
      }

      function filtered() {
        var fUid = document.getElementById('fUid').value.trim();
        var fName = document.getElementById('fName').value.trim().toLowerCase();
        var fAddr = document.getElementById('fAddr').value.trim().toLowerCase();
        var regA = dateVal(document.getElementById('fRegA').value);
        var regB = dateVal(document.getElementById('fRegB').value);
        var nftA = numVal(document.getElementById('fNftA').value, -Infinity);
        var nftB = numVal(document.getElementById('fNftB').value, Infinity);
        var powA = numVal(document.getElementById('fPowA').value, -Infinity);
        var powB = numVal(document.getElementById('fPowB').value, Infinity);
        var proA = numVal(document.getElementById('fProA').value, -Infinity);
        var proB = numVal(document.getElementById('fProB').value, Infinity);
        var extA = numVal(document.getElementById('fExtA').value, -Infinity);
        var extB = numVal(document.getElementById('fExtB').value, Infinity);
        var endOf = function (ts) { return ts ? ts + M.DAY - 1 : null; };
        return M.users.filter(function (u) {
          if (fUid && String(u.uid) !== fUid) return false;                       // UID 精确
          if (fName && u.username.toLowerCase().indexOf(fName) === -1) return false; // 用户名模糊
          if (fAddr && u.addr.indexOf(fAddr) === -1) return false;
          if (regA && u.regTs < regA) return false;
          if (regB && u.regTs > endOf(regB)) return false;
          if (u.nftCount < nftA || u.nftCount > nftB) return false;
          if (u.power < powA || u.power > powB) return false;
          if (u.storyProduced < proA || u.storyProduced > proB) return false;
          if (u.storyExtracted < extA || u.storyExtracted > extB) return false;
          return true;
        });
      }

      function shortAddr(addr) {
        return addr.slice(0, 8) + '…' + addr.slice(-6);
      }

      window.sortBy = function (key) {
        if (state.sortKey === key) state.sortDir = -state.sortDir;
        else { state.sortKey = key; state.sortDir = -1; }
        state.page = 1;
        renderList();
      };

      function renderArrows() {
        document.querySelectorAll('th.sortable').forEach(function (th) {
          var arrow = th.querySelector('.arrow');
          var active = th.getAttribute('data-k') === state.sortKey;
          arrow.textContent = active ? (state.sortDir === 1 ? ' ▲' : ' ▼') : '';
        });
      }

      function renderList() {
        renderArrows();
        var list = filtered();
        var total = list.length;
        document.getElementById('listTotal').textContent = '共 ' + M.users.length + ' 人 · 筛选后 ' + total + ' 人';

        var key = state.sortKey;
        list.sort(function (a, b) {
          var va = a[key], vb = b[key];
          var r = (va < vb ? -1 : va > vb ? 1 : 0);
          return r * state.sortDir;
        });

        var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        if (state.page > totalPages) state.page = totalPages;
        var start = (state.page - 1) * PAGE_SIZE;
        var pageData = list.slice(start, start + PAGE_SIZE);

        var body = document.getElementById('userBody');
        document.getElementById('userEmpty').style.display = total ? 'none' : 'block';
        body.style.display = total ? '' : 'none';
        body.innerHTML = pageData.map(function (u) {
          return '<tr>' +
            '<td class="num">' + u.uid + '</td>' +
            '<td><strong>' + u.username + '</strong></td>' +
            '<td class="mono" title="' + u.addr + '">' + shortAddr(u.addr) + '</td>' +
            '<td class="num">' + fmtTs(u.regTs) + '</td>' +
            '<td class="num">' + fmtTs(u.activeTs) + '</td>' +
            '<td class="num">' + (u.nftCount || 0) + '</td>' +
            '<td class="num">' + (u.power ? fmtNum(u.power) : '<span class="weak">—</span>') + '</td>' +
            '<td class="num">' + (u.storyProduced ? fmtNum(u.storyProduced) : '<span class="weak">0</span>') + '</td>' +
            '<td class="num">' + (u.storyExtracted ? fmtNum(u.storyExtracted) : '<span class="weak">0</span>') + '</td>' +
            '</tr>';
        }).join('');

        var pg = document.getElementById('pagination');
        if (totalPages <= 1) { pg.innerHTML = ''; }
        else {
          pg.innerHTML =
            '<button ' + (state.page <= 1 ? 'disabled' : '') + ' onclick="gotoPage(' + (state.page - 1) + ')">← 上一页</button>' +
            '<span class="page-info">第 ' + state.page + ' / ' + totalPages + ' 页（每页 ' + PAGE_SIZE + ' 条）</span>' +
            '<button ' + (state.page >= totalPages ? 'disabled' : '') + ' onclick="gotoPage(' + (state.page + 1) + ')">下一页 →</button>';
        }
      }

      window.gotoPage = function (p) { state.page = p; renderList(); };
      // 点击「🔍 查询」才应用筛选（筛选栏内按 Enter 亦可）
      window.doSearch = function () { state.page = 1; renderList(); };
      window.resetFilters = function () {
        document.querySelectorAll('#filterBar input').forEach(function (i) { i.value = ''; });
        state.page = 1;
        renderList();
      };

      document.addEventListener('DOMContentLoaded', function () {
        renderOverview();
        renderList();
        document.getElementById('filterBar').addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
        });
      });
    })();
  </script>
</body>
</html>
