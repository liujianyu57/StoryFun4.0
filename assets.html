<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的资产 · 发射台</title>
  <link rel="stylesheet" href="launch.css" />
  <style>
    /* ===== 我的资产 ===== */
    .as-hero { padding: 30px 0 4px; }
    .as-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .as-sub { font-size: 13px; color: var(--text-2); margin-top: 4px; }

    .as-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 20px 0 8px; }
    .as-stat { padding: 16px 18px; }
    .as-stat .k { font-size: 12px; color: var(--text-2); }
    .as-stat .v { font-size: 20px; font-weight: 800; margin-top: 4px; letter-spacing: -0.01em; }
    .as-stat .s { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .as-stat.total { background: var(--text); color: #fff; }
    .as-stat.total .k { color: rgba(255,255,255,.6); }
    .as-stat.total .s { color: rgba(255,255,255,.6); }
    .as-stat.total .v { font-size: 24px; }
    .as-stat.total .v.up { color: #3BE08A; }
    .as-stat.total .v.down { color: #FF7B8A; }
    .as-stat.total .s span.up { color: #3BE08A; }
    .as-stat.total .s span.down { color: #FF7B8A; }

    .as-tabs { display: flex; gap: 4px; margin: 24px 0 16px; border-bottom: 1px solid var(--border); }
    .as-tab {
      border: none; background: none; padding: 10px 14px; font-size: 14px; font-weight: 600;
      color: var(--text-2); border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .as-tab.on { color: var(--text); border-bottom-color: var(--accent); }
    .as-tab .cnt { font-size: 11px; color: var(--text-3); margin-left: 5px; }

    .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .asset-card { display: flex; gap: 14px; padding: 14px; align-items: center; }
    .asset-cover { width: 64px; height: 64px; border-radius: 14px; overflow: hidden; background: var(--surface-2); flex-shrink: 0; position: relative; cursor: pointer; }
    .asset-cover img { width: 100%; height: 100%; object-fit: cover; }
    .asset-body { flex: 1; min-width: 0; }
    .asset-name { font-weight: 700; font-size: 14.5px; display: flex; gap: 6px; align-items: baseline; cursor: pointer; }
    .asset-name:hover { text-decoration: underline; }
    .asset-sub { font-size: 12px; color: var(--text-2); margin-top: 3px; }
    .asset-right { text-align: right; flex-shrink: 0; }
    .asset-right .v { font-weight: 700; font-size: 14px; }
    .asset-right .s { font-size: 11.5px; color: var(--text-2); margin-top: 3px; }
    .asset-btn {
      margin-top: 8px; height: 30px; padding: 0 12px; border-radius: 9px; font-size: 12.5px; font-weight: 600;
      border: 1px solid var(--accent); background: var(--accent); color: #fff;
    }
    .asset-btn.ghost { background: var(--surface); color: var(--text); border-color: var(--border); }
    .asset-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* 历史 */
    /* pons Positions（Open positions 列表行） */
    .pos-head { margin: 2px 0 14px; }
    .pos-title { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
    .pos-sub { font-size: 12px; color: var(--text-3); margin-top: 3px; }
    .pos-scroll { overflow-x: auto; }
    .pos-list { display: flex; flex-direction: column; gap: 8px; min-width: 780px; }
    .pos-row {
      display: grid; grid-template-columns: minmax(190px, 1.5fr) repeat(3, minmax(112px, .95fr)) minmax(128px, 1fr) 46px;
      gap: 8px; align-items: center; padding: 12px 16px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      cursor: pointer; transition: background .15s, border-color .15s;
    }
    .pos-row:hover { background: var(--surface-2); border-color: var(--border-strong); }
    .p-cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .p-token { display: flex; flex-direction: row; align-items: center; gap: 11px; }
    .p-logo { width: 42px; height: 42px; border-radius: 11px; overflow: hidden; background: var(--surface-2);
      display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; color: var(--text-3); }
    .p-logo img { width: 100%; height: 100%; object-fit: cover; }
    .p-tt { min-width: 0; }
    .p-tt b { display: block; font-size: 13.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .p-tt i { display: block; font-style: normal; font-size: 11px; color: var(--text-3); font-weight: 600; }
    .p-claim { display: inline-block; margin-top: 5px; border: 1px solid var(--border); border-radius: 999px;
      background: var(--surface-2); color: var(--text-2); font-size: 10px; font-weight: 700; padding: 2px 9px; cursor: pointer; }
    .p-claim:hover { color: var(--text); border-color: var(--text-3); }
    .p-lab { font-size: 10.5px; color: var(--text-3); font-weight: 600; white-space: nowrap; }
    .p-val { font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .p-pnl .p-val { display: flex; align-items: center; gap: 5px; }
    .p-pnl .p-pct { font-size: 11px; font-weight: 600; color: var(--text-3); }
    .p-share-cell { display: flex; justify-content: flex-end; }
    .p-share { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text-2); cursor: pointer; display: grid; place-items: center; transition: all .15s; }
    .p-share:hover { color: var(--text); border-color: var(--text-3); background: var(--surface); }
    .p-share svg { width: 15px; height: 15px; }

    /* 分享弹层：HTML 分享卡（视觉近似分享图，不真实生成文件） */
    .share-overlay { position: fixed; inset: 0; z-index: 500; display: none; align-items: center; justify-content: center;
      background: rgba(10,11,13,.5); padding: 20px; }
    .share-overlay.open { display: flex; }
    .share-card { width: min(400px, 94vw); background: #fff; border-radius: 20px; padding: 16px;
      box-shadow: 0 24px 70px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 12px; }
    .share-head { display: flex; align-items: center; justify-content: space-between; }
    .share-head b { font-size: 14px; font-weight: 700; }
    .share-head button { width: 30px; height: 30px; border-radius: 50%; border: none; background: rgba(0,0,0,.06);
      color: #555; font-size: 14px; cursor: pointer; }
    .share-card .sv { background: #fff; border: 1px solid #F0F1F3; border-radius: 16px; padding: 20px 20px 14px;
      display: flex; flex-direction: column; gap: 16px; }
    .sv-head { display: flex; align-items: baseline; justify-content: space-between; }
    .sv-head .sv-k { font-size: 11px; font-weight: 700; letter-spacing: .02em; color: #8E8E93; }
    .sv-head .sv-brand { font-size: 11px; font-weight: 700; color: #0A0B0D; }
    .sv-mid { display: flex; align-items: center; gap: 12px; }
    .sv-logo { width: 52px; height: 52px; border-radius: 13px; overflow: hidden; background: #F4F5F7; flex: none;
      display: grid; place-items: center; font-size: 18px; font-weight: 800; color: #B9BEC4; }
    .sv-logo img { width: 100%; height: 100%; object-fit: cover; }
    .sv-tt b { display: block; font-size: 17px; font-weight: 800; }
    .sv-tt i { display: block; font-style: normal; font-size: 12px; color: #8E8E93; font-weight: 600; margin-top: 2px; }
    .sv-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .sv-stats > div { background: #F7F8FA; border-radius: 12px; padding: 10px 12px; min-width: 0; }
    .sv-stats label { display: block; font-size: 10px; color: #8E8E93; font-weight: 600; margin-bottom: 3px; }
    .sv-stats b { display: block; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sv-stats .up b { color: #0E9F6E; }
    .sv-stats .down b { color: #E5484D; }
    .sv-foot { text-align: center; font-size: 10px; color: #C7CBD0; }
    .share-actions { display: flex; gap: 10px; }
    .share-actions button { flex: 1; height: 42px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; }
    .share-actions .sv-copy { background: rgba(0,0,0,.06); color: #111; }
    .share-actions .sv-copy:hover { background: rgba(0,0,0,.12); }
    .share-actions .sv-down { background: #0A0B0D; color: #fff; }
    .share-actions .sv-down:hover { opacity: .88; }


    /* pons Launches / Activity 列表行 */
    .pl-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .pl-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 16px; cursor: pointer; text-decoration: none; color: inherit;
      transition: background .15s, border-color .15s; }
    .pl-row:hover { background: var(--surface-2); border-color: var(--border-strong); }
    .pl-logo { width: 40px; height: 40px; border-radius: 11px; overflow: hidden; background: var(--surface-2); flex: none;
      display: grid; place-items: center; font-weight: 700; font-size: 15px; color: var(--text-3); }
    .pl-logo img { width: 100%; height: 100%; object-fit: cover; }
    .pl-copy { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .pl-copy strong { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl-copy small { font-size: 11px; color: var(--text-3); font-weight: 600; font-variant-numeric: tabular-nums; }
    .pl-copy .ac-word.buy { color: var(--up); }
    .pl-copy .ac-word.sell { color: var(--down); }
    .pl-status { flex: none; display: flex; align-items: center; gap: 8px; }
    .pl-state { font-size: 12px; color: var(--text-3); font-weight: 600; white-space: nowrap; }
    .pl-claimbtn { border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); color: var(--text);
      font-size: 11px; font-weight: 700; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
    .pl-claimbtn:hover { border-color: var(--text); background: var(--surface); }
    .act-time { flex: none; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }

    .history-card { padding: 6px 18px 14px; }
    .his-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .his-row:last-child { border-bottom: none; }
    .his-side { width: 44px; font-weight: 700; }
    .his-side.buy { color: var(--up); }
    .his-side.sell { color: var(--down); }
    .his-coin { font-weight: 600; width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .his-pnl { font-size: 11.5px; font-weight: 700; width: 76px; text-align: right; flex-shrink: 0; }
    .his-mid { flex: 1; color: var(--text-2); text-align: right; }
    .his-time { color: var(--text-3); font-size: 11.5px; width: 40px; text-align: right; }

    /* AI 叙事回放 */
    .ai-card { padding: 14px; display: flex; gap: 12px; align-items: center; }
    .ai-thumb { width: 92px; height: 60px; border-radius: 10px; overflow: hidden; position: relative; cursor: pointer; background: var(--text); flex-shrink: 0; }
    .ai-thumb video { width: 100%; height: 100%; object-fit: cover; }
    .ai-thumb .pb { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; }

    /* ===== Profile 骨架（参考 pons Profile） ===== */
    .pf-visit { display: flex; align-items: center; gap: 10px; margin: 2px 0 14px; width: max-content;
      font-size: 12px; color: var(--text-2); background: var(--accent-soft); border: 1px solid var(--border);
      border-radius: 999px; padding: 6px 14px; }
    .pf-visit b { font-weight: 700; }
    .pf-visit a { color: var(--text); font-weight: 700; text-decoration: underline; margin-left: 4px; }
    .pf-hero { display: flex; align-items: center; gap: 16px; margin: 8px 0 20px; flex-wrap: wrap; }
    .pf-id { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .pf-avatar { width: 54px; height: 54px; border-radius: 50%; overflow: hidden; background: var(--text); color: #fff; display: grid; place-items: center; font-size: 20px; font-weight: 800; flex-shrink: 0; }
    .pf-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .pf-addr-row { display: flex; align-items: center; gap: 10px; min-width: 0; margin-top: 0; }
    .pf-addr { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--text);
      word-break: break-all; overflow-wrap: anywhere; line-height: 1.45; letter-spacing: .01em; }
    .pf-copy { border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); color: var(--text-2); font-size: 11px; font-weight: 700; padding: 3px 10px; cursor: pointer; }
    .pf-copy:hover { color: var(--text); border-color: var(--text-3); }

    /* Portfolio：上=余额块，下=通栏大图（参考 .profile-portfolio-overview 单列 grid） */
    .pf-portfolio { border-radius: 22px; padding: 22px 24px; display: grid; gap: 20px; background: var(--surface); border: 1px solid var(--border); }
    .pf-balance { display: grid; justify-items: start; gap: 4px; }
    .pf-bal-label { font-size: 12px; color: var(--text-3); }
    .pf-bal-num { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
    .pf-bal-sub { font-size: 12.5px; color: var(--text-2); }
    .pf-chart { display: flex; flex-direction: column; gap: 10px; min-height: 320px; }
    .pf-chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .pf-chart-price { font-size: 20px; font-weight: 800; }
    .pf-chart-price .pf-pnl-rng { font-size: 12px; font-weight: 600; color: var(--text-3); margin-left: 8px; }
    .pf-ranges { display: flex; gap: 4px; }
    .pf-ranges button { height: 28px; padding: 0 12px; border-radius: 999px; border: none; background: none; color: var(--text-2); font-size: 12px; font-weight: 700; cursor: pointer; }
    .pf-ranges button.on { background: var(--accent-soft); color: var(--text); }
    .pf-canvas { width: 100%; height: 260px; display: block; }

    @media (max-width: 760px) {
      .pf-hero { align-items: flex-start; }
      .pf-portfolio { padding: 18px 16px; }
      .pf-canvas { height: 200px; }
    }
  </style>
</head>
<body>
  <div id="launch-header-host"></div>

  <div class="lp-overlay" id="playModal">
    <div class="lp-modal" style="max-width:680px;padding:0;overflow:hidden;background:#0A0B0D">
      <video id="playVideo" controls autoplay playsinline style="width:100%;display:block;max-height:70vh"></video>
    </div>
  </div>

  <main class="launch-shell">
    <!-- 身份 hero -->
    <div class="pf-visit" id="pfVisitBar" style="display:none"><b>访客视图</b>· 演示数据 · <a href="assets.html">返回我的资产</a></div>
    <div class="pf-hero" id="pfHero">
      <div class="pf-id">
        <div class="pf-avatar" id="pfAvatar">—</div>
        <div style="min-width:0">
          <div class="pf-addr-row">
            <span class="pf-addr num" id="pfAddr">—</span>
            <button type="button" class="pf-copy" id="pfCopy">复制</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Portfolio：上余额块 + 下通栏大图 -->
    <div class="pf-portfolio" id="pfPortfolio">
      <div class="pf-balance">
        <span class="pf-bal-label">Portfolio balance</span>
        <strong class="pf-bal-num num" id="pfBal">—</strong>
        <small class="pf-bal-sub" id="pfBalSub">—</small>
      </div>
      <div class="pf-chart">
        <div class="pf-chart-head">
          <p class="pf-chart-price num" id="pfPnlHead">$0<span class="pf-pnl-rng">PnL · 1d</span></p>
          <div class="pf-ranges" id="pfRanges">
            <button type="button" class="on" data-r="1d">1D</button>
            <button type="button" data-r="7d">7D</button>
            <button type="button" data-r="30d">30D</button>
          </div>
        </div>
        <canvas class="pf-canvas" id="pfChart"></canvas>
      </div>
    </div>

    <div class="as-tabs">
      <button class="as-tab on" data-t="hold">Positions</button>
      <button class="as-tab" data-t="closed">History</button>
      <button class="as-tab" data-t="tx">Activity</button>
      <button class="as-tab" data-t="made">Launches</button>
    </div>

    <div id="asContent">
      <div class="empty" id="needLogin" style="display:none">
        <div class="empty-icon">🔑</div>
        <div class="empty-title">登录后查看资产</div>
        <div class="empty-desc">需要登录才能查看持仓与创建的币</div>
        <button class="btn btn-primary" onclick="openLoginModal()">登录 / 注册</button>
      </div>
      <div id="asBody"></div>
    </div>
  </main>

  <!-- 持仓分享（HTML 分享卡示意，不生成图片文件） -->
  <div class="share-overlay" id="shareModal">
    <div class="share-card">
      <div class="share-head"><b>分享持仓</b><button type="button" id="shareClose" aria-label="关闭">✕</button></div>
      <div class="sv" id="svBody"></div>
      <div class="share-actions">
        <button type="button" class="sv-copy" onclick="shareAction('复制图片')">复制图片</button>
        <button type="button" class="sv-down" onclick="shareAction('下载图片')">下载图片</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="launch-coin.js"></script>
  <script src="launch-shell.js"></script>
  <script>
    // ============================================================
    //  我的资产
    // ============================================================
    var tab = 'hold';
    // 访客模式：assets.html?address=0x… → 以该地址查看（数据为演示档案）
    var visitorAddr = (function () {
      try {
        var q = new URLSearchParams(location.search).get('address');
        return (q && /^0x[0-9a-fA-F]{40}$/.test(q)) ? q.toLowerCase() : '';
      } catch (e) { return ''; }
    })();
    var esc = function (s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    };

    function coinById(id) { return Launch.coinById(id); }
    function myHoldings() {
      var out = [];
      Object.keys(Launch.USER.holdings || {}).forEach(function (id) {
        var c = coinById(id); var h = Launch.USER.holdings[id];
        if (c && h && h.amount > 0) out.push({ coin: c, hold: h });
      });
      return out;
    }
    function myCreated() {
      return (Launch.USER.created || []).map(coinById).filter(Boolean);
    }
    function myAiVideos() {
      var out = [];
      try {
        var vids = JSON.parse(localStorage.getItem('storyfun_my_videos') || '[]');
        out = vids.filter(function (v) { return v.kind === 'ai'; });
      } catch (e) {}
      return out;
    }

    var pnlRange = '1d';
    var pfMaxUsd = 1;             // 图 Y 轴上限（美元）
    function fmtSignedUsd(n) {
      if (Math.abs(n) < 0.005) return '$0';
      return (n >= 0 ? '+' : '−') + Launch.fmtUsd(Math.abs(n));
    }
    function pnlSeries(r) {
      var n = r === '7d' ? 84 : r === '30d' ? 120 : 48;
      var seed = 12345;
      var id = (window.Launch && Launch.USER && Launch.USER.id) || 'demo';
      for (var i = 0; i < id.length; i++) seed = (seed * 31 + id.charCodeAt(i)) >>> 0;
      seed = (seed + { '1d': 11, '7d': 47, '30d': 101 }[r] * 977) >>> 0;
      var out = [], v = 0.5;
      for (var k = 0; k < n; k++) {
        seed = (seed * 9301 + 49297) % 233280;
        var drift = (out.length === 0) ? 0 : (pfPnlSign || 1) * 0.002;
        v = Math.max(0.05, Math.min(1, v + (seed / 233280 - 0.48) * 0.06 + drift));
        out.push(v);
      }
      return out;
    }
    function drawPnl() {
      var cv = document.getElementById('pfChart');
      if (!cv || !cv.getContext) return;
      var dpr = window.devicePixelRatio || 1;
      var w = cv.clientWidth || 560, h = cv.clientHeight || 260;
      cv.width = w * dpr; cv.height = h * dpr;
      var ctx = cv.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, w, h);
      var s = pnlSeries(pnlRange);
      var padL = 40, padR = 10, padT = 12, padB = 8;
      var iw = w - padL - padR, ih = h - padT - padB;
      // 网格 4 线 + Y 轴美元刻度
      ctx.font = '10px ui-monospace, monospace';
      ctx.fillStyle = '#B9BEC4';
      ctx.strokeStyle = '#F0F1F3'; ctx.lineWidth = 1;
      for (var g = 0; g < 4; g++) {
        var gy = padT + (ih / 3) * g;
        ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(w - padR, gy); ctx.stroke();
        var usd = pfMaxUsd * (1 - g / 3);
        ctx.textAlign = 'left';
        ctx.fillText(fmtCompactUsd(usd), 2, gy + 3);
      }
      var x0 = padL, y0 = padT + ih;
      var px = function (i) { return x0 + (iw / (s.length - 1)) * i; };
      var py = function (v) { return y0 - v * ih; };
      // 渐变面积
      var gr = ctx.createLinearGradient(0, 0, 0, h);
      gr.addColorStop(0, 'rgba(10,11,13,0.12)');
      gr.addColorStop(1, 'rgba(10,11,13,0)');
      ctx.beginPath(); ctx.moveTo(px(0), py(s[0]));

      ctx.fillStyle = gr; ctx.fill();

      for (var i3 = 1; i3 < s.length; i3++) ctx.lineTo(px(i3), py(s[i3]));
      ctx.strokeStyle = '#0A0B0D'; ctx.lineWidth = 2; ctx.stroke();

      var ex = px(s.length - 1), ey = py(s[s.length - 1]);
      ctx.beginPath(); ctx.arc(ex, ey, 3.5, 0, Math.PI * 2); ctx.fillStyle = '#0A0B0D'; ctx.fill();

          '</div>' +
          (coined && v.coinId
            ? '<button class="asset-btn ghost" onclick="goCoin(\'' + esc(v.coinId) + '\')">发币详情</button>'
            : '<button class="asset-btn" onclick="reuse(' + i + ')">用它发币</button>') +
          '</div>';
      }).join('') + '</div>';
      window._aiVids = vids;
    }

    // pons 金额/币量缩写（小写 k）
    function fmtPonsAmt(n) {
      if (n == null || isNaN(n)) return '—';
      if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(2) + 'k';
      if (n >= 1) return n.toFixed(2);
      return Number(n).toPrecision(3);
    }
    function fmtAmt(n) {
      if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
      return Math.floor(n) + '';
    }
    function goCoin(id) { location.href = 'coin-detail.html?id=' + encodeURIComponent(id); }
    function playAi(i) {
      var v = window._aiVids[i];
      if (!v || !v.video) { Launch.toast('该叙事暂无视频', 'warn'); return; }
      document.getElementById('playVideo').src = v.video;
      document.getElementById('playModal').classList.add('open');
      document.body.style.overflow = 'hidden';
      setTimeout(function () { document.getElementById('playVideo').play().catch(function () {}); }, 120);
    }
    function reuse(i) {
      var v = window._aiVids[i];
      if (!v) return;
      location.href = 'launch.html?reuse=' + encodeURIComponent(JSON.stringify(v));
    }
    document.getElementById('playModal').addEventListener('click', function (e) {
      if (e.target === this) { this.classList.remove('open'); document.getElementById('playVideo').pause(); document.body.style.overflow = ''; }
    });

    function doClaim(id) {
      if (!Launch.isLoggedIn()) { openLoginModal(); return; }
      var r = Launch.claim(id);
      if (r.ok) {
        Launch.toast('已领取 ' + Launch.fmtUsd(r.usd), 'ok');
        renderSummary();
        renderMade();
      } else {
        Launch.toast(r.msg || '暂无可领取收益', 'warn');
      }
    }

    function render() {
      var logged = Launch.isLoggedIn();
      document.getElementById('needLogin').style.display = logged ? 'none' : 'block';
      document.getElementById('asBody').style.display = logged ? '' : 'none';
      document.getElementById('pfHero').style.display = logged ? '' : 'none';
      document.getElementById('pfPortfolio').style.display = logged ? '' : 'none';
      if (!logged) return;
      renderSummary();
      if (tab === 'hold') renderHold();
      else if (tab === 'closed') renderClosed();
      else if (tab === 'made') renderMade();
      else if (tab === 'tx') renderTx();
    }

    window.onLaunchShellReady = function () {
      // PnL 范围切换
      document.getElementById('pfRanges').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-r]');
        if (!b) return;
        pnlRange = b.getAttribute('data-r');
        document.querySelectorAll('#pfRanges button').forEach(function (x) { x.classList.toggle('on', x === b); });
        renderSummary();
      });
      window.addEventListener('resize', function () { drawPnl(); });
      // 复制地址
      document.getElementById('pfCopy').addEventListener('click', function () {
        var a = document.getElementById('pfAddr').textContent;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(a).catch(function () {});
        }
        Launch.toast('地址已复制', 'ok');
      });
      // Tab
      document.querySelectorAll('.as-tab').forEach(function (b) {
        b.addEventListener('click', function () {
          tab = b.getAttribute('data-t');
          document.querySelectorAll('.as-tab').forEach(function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          render();
        });
      });
      // 登录状态变化重新渲染
      window.addEventListener('auth-ready', function () { render(); });
      render();
    };
  </script>
  <script src="load-desktop-header.js"></script>
  <script src="load-sidebar.js"></script>
  <script src="load-bottom-nav.js"></script>
</body>
</html>
