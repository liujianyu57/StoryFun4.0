<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>创建 · 发射台</title>
  <link rel="stylesheet" href="launch.css" />
  <style>
    /* ===== 创建向导 ===== */
    .create-wrap { max-width: 680px; margin: 0 auto; padding: 28px 0 96px; }
    .step-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 30px; }
    .step-dot {
      display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-3);
      font-weight: 600;
    }
    .step-dot i {
      width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft);
      display: grid; place-items: center; font-style: normal; font-size: 11px;
    }
    .step-dot.on { color: var(--text); }
    .step-dot.on i { background: var(--accent); color: #fff; }
    .step-dot.done { color: var(--text-2); }
    .step-dot.done i { background: var(--text); color: #fff; }
    .step-line { flex: 1; height: 1px; background: var(--border); max-width: 60px; }

    .create-title { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
    .create-desc { font-size: 13px; color: var(--text-2); margin: 6px 0 22px; }

    .source-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .source-card {
      border: 1.5px solid var(--border); border-radius: var(--radius); padding: 18px;
      cursor: pointer; background: var(--surface); transition: border-color .15s, box-shadow .15s;
    }
    .source-card:hover { border-color: var(--border-strong); }
    .source-card.on { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10,11,13,.05); }
    .source-ico { width: 42px; height: 42px; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; font-size: 20px; margin-bottom: 12px; }
    .source-card.on .source-ico { background: var(--accent); color: #fff; }
    .source-name { font-size: 15px; font-weight: 700; }
    .source-sub { font-size: 12.5px; color: var(--text-2); margin-top: 4px; line-height: 1.5; }

    /* AI 生成面板 */
    .ai-panel { display: none; margin-top: 18px; }
    .ai-panel.show { display: block; }
    .style-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
    .style-chip {
      height: 30px; padding: 0 14px; border-radius: 999px; font-size: 12.5px; font-weight: 500;
      border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
    }
    .style-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .gen-btn { height: 46px; }
    .gen-hint { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-3); margin-top: 8px; }

    /* 生成演出 */
    .gen-stage { display: none; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-top: 16px; background: var(--text); color: #fff; }
    .gen-stage.show { display: block; }
    .gen-top { padding: 18px 20px 6px; font-size: 12px; color: rgba(255,255,255,.6); }
    .gen-kws { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 20px 16px; }
    .gen-kw {
      font-size: 12px; border: 1px solid rgba(255,255,255,.2); border-radius: 999px;
      padding: 4px 10px; opacity: 0; animation: kwIn .4s forwards;
    }
    @keyframes kwIn { from { opacity: 0; transform: scale(.9);} to { opacity: 1; } }
    .gen-progress { margin: 0 20px 8px; height: 3px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; }
    .gen-progress i { display: block; height: 100%; background: #fff; width: 0%; transition: width .2s; }
    .gen-timer { font-family: var(--mono); font-size: 40px; font-weight: 800; text-align: center; padding: 8px 0 2px; }
    .gen-caption { text-align: center; font-size: 12px; color: rgba(255,255,255,.6); padding-bottom: 18px; }
    .gen-poster { display: none; grid-template-columns: 96px 1fr; gap: 14px; padding: 16px 20px 20px; background: #fff; }
    .gen-poster.show { display: grid; }
    .gen-poster-img { width: 96px; height: 96px; border-radius: 12px; overflow: hidden; background: var(--surface-2); position: relative; }
    .gen-poster-img img, .gen-poster-img video { width: 100%; height: 100%; object-fit: cover; }
    .gen-poster-name { font-size: 15px; font-weight: 700; color: var(--text); }
    .gen-poster-tag { font-size: 11px; color: var(--text-2); margin: 4px 0 8px; }
    .gen-poster-desc { font-size: 12.5px; color: var(--text-2); line-height: 1.6; }

    /* 作品选择 */
    .work-panel { display: none; margin-top: 18px; }
    .work-panel.show { display: block; }
    .work-list { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
    .work-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer;
      border-bottom: 1px solid var(--border); transition: background .12s;
    }
    .work-item:last-child { border-bottom: none; }
    .work-item:hover { background: var(--surface-2); }
    .work-item.on { background: rgba(10,11,13,.03); }
    .work-cover { width: 56px; height: 42px; border-radius: 8px; overflow: hidden; background: var(--surface-2); flex-shrink: 0; }
    .work-cover img { width: 100%; height: 100%; object-fit: cover; }
    .work-info { flex: 1; min-width: 0; }
    .work-title { font-size: 13.5px; font-weight: 600; }
    .work-meta { font-size: 11.5px; color: var(--text-2); margin-top: 2px; }
    .work-check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border-strong); display: grid; place-items: center; flex-shrink: 0; }
    .work-item.on .work-check { border-color: var(--accent); background: var(--accent); color: #fff; }
    .work-empty { padding: 28px; text-align: center; font-size: 13px; color: var(--text-2); }

    .nav-row { display: flex; gap: 10px; margin-top: 26px; }
    .nav-row .spacer { flex: 1; }
    .footer-note { font-size: 12px; color: var(--text-3); text-align: center; margin-top: 18px; }

    /* 参数表单 */
    .param-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
    .fee-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-top: 6px; }
    .fee-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); padding: 4px 0; }
    .fee-row b { color: var(--text); font-weight: 600; }
    .fee-row.total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 10px; font-weight: 700; color: var(--text); }

    /* 确认预览 */
    .preview-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      overflow: hidden; margin-bottom: 18px;
    }
    .preview-cover { aspect-ratio: 2 / 1; position: relative; background: var(--text); }
    .preview-cover img { width: 100%; height: 100%; object-fit: cover; opacity: .9; }
    .preview-body { padding: 18px 20px; }
    .preview-name { font-size: 19px; font-weight: 800; display: flex; gap: 8px; align-items: baseline; }
    .preview-sym { color: var(--text-3); font-size: 13px; }
    .preview-tag { font-size: 13px; color: var(--text-2); margin: 8px 0; }
    .preview-meta { display: flex; gap: 20px; padding-top: 14px; border-top: 1px solid var(--border); }
    .preview-meta div .k { font-size: 11px; color: var(--text-3); display: block; }
    .preview-meta div .v { font-size: 14px; font-weight: 700; }

    .success-wrap { text-align: center; padding: 40px 0; }
    .success-ico {
      width: 72px; height: 72px; border-radius: 50%; background: var(--text); color: #fff;
      display: grid; place-items: center; margin: 0 auto 18px; font-size: 30px;
      animation: pop .4s ease;
    }
    @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .success-title { font-size: 20px; font-weight: 800; }
    .success-desc { font-size: 13px; color: var(--text-2); margin: 8px 0 26px; }
    .success-card { max-width: 300px; margin: 0 auto 26px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .success-card img { width: 100%; aspect-ratio: 16/10; object-fit: cover; }
    .success-card .sc-body { padding: 12px 16px 16px; }
    .success-card .sc-name { font-weight: 700; font-size: 15px; display: flex; gap: 6px; }
    .success-card .sc-sub { font-size: 12px; color: var(--text-2); margin-top: 4px; }

    .hide { display: none; }
    @media (max-width: 640px) {
      .source-cards { grid-template-columns: 1fr; }
      .param-grid { grid-template-columns: 1fr; }
      .step-dot .lbl { display: none; }
    }
  </style>
</head>
<body>
  <div id="launch-header-host"></div>

  <main class="launch-shell">
    <div class="create-wrap">
      <!-- 步骤条 -->
      <div class="step-bar">
        <span class="step-dot on" data-step="1"><i>1</i><span class="lbl">叙事</span></span><span class="step-line"></span>
        <span class="step-dot" data-step="2"><i>2</i><span class="lbl">参数</span></span><span class="step-line"></span>
        <span class="step-dot" data-step="3"><i>3</i><span class="lbl">确认</span></span>
      </div>

      <!-- STEP 1 -->
      <section id="step1">
        <div class="create-title">用视频讲它是谁</div>
        <div class="create-desc">AI 生成一段 15 秒叙事，或从你的作品中选用。</div>

        <div class="source-cards">
          <div class="source-card on" id="srcAI" onclick="pickSource('ai')">
            <div class="source-ico">✦</div>
            <div class="source-name">AI 生成</div>
            <div class="source-sub">一句话生成 15s 叙事视频 · 生成费 0.02 ETH</div>
          </div>
          <div class="source-card" id="srcWork" onclick="pickSource('work')">
            <div class="source-ico">🎬</div>
            <div class="source-name">我的作品</div>
            <div class="source-sub">从已发布的短剧或视频中选择</div>
          </div>
        </div>

        <!-- AI 面板 -->
        <div class="ai-panel show" id="aiPanel">
          <textarea class="input" id="aiPrompt" rows="2" placeholder="描述你想生成的叙事，例如：一只穿西装的猫在月球上打碟"></textarea>
          <div class="style-row" id="styleRow">
            <button class="style-chip on" data-s="古风">古风</button>
            <button class="style-chip" data-s="赛博">赛博</button>
            <button class="style-chip" data-s="卡通">卡通</button>
            <button class="style-chip" data-s="黑白">黑白</button>
            <button class="style-chip" data-s="水彩">水彩</button>
          </div>
          <button class="btn btn-primary gen-btn btn-block" id="genBtn" onclick="startGen()">生成</button>
          <div class="gen-hint"><span>生成费 0.02 ETH</span><span id="ethHint"></span></div>
          <div class="inline-warn danger" id="genErr"></div>
        </div>

        <!-- 生成演出 -->
        <div class="gen-stage" id="genStage">
          <div class="gen-top">解析提示词 · 渲染关键帧 · 合成 15s 片段</div>
          <div class="gen-kws" id="genKws"></div>
          <div class="gen-progress"><i id="genBar"></i></div>
          <div class="gen-timer num" id="genTimer">15.0</div>
          <div class="gen-caption" id="genCaption">生成中…</div>
        </div>
        <div class="gen-poster" id="genPoster"></div>

        <!-- 作品面板 -->
        <div class="work-panel" id="workPanel">
          <div class="work-list" id="workList"></div>
          <div class="inline-warn warn" id="workErr"></div>
        </div>

        <div class="nav-row">
          <a class="btn btn-ghost" href="launchpad.html">取消</a>
          <div class="spacer"></div>
          <button class="btn btn-primary" id="toStep2" onclick="goStep(2)" disabled>下一步</button>
        </div>
      </section>

      <!-- STEP 2 -->
      <section id="step2" class="hide">
        <div class="create-title">币的参数</div>
        <div class="create-desc">名称与符号会用于市场展示，简介讲清它的故事。</div>
        <div class="param-grid">
          <div class="field">
            <div class="field-label">名称</div>
            <input class="input" id="pName" maxlength="24" placeholder="币名" />
          </div>
          <div class="field">
            <div class="field-label">符号</div>
            <input class="input" id="pSymbol" maxlength="6" placeholder="SYMBOL" style="text-transform:uppercase" />
            <div class="form-error" id="symErr"></div>
          </div>
        </div>
        <div class="field">
          <div class="field-label">一句话简介</div>
          <textarea class="input" id="pTag" rows="2" placeholder="一句话讲清这个币是什么"></textarea>
          <div class="form-hint" id="pTagCount">0 / 60</div>
        </div>
        <div class="field">
          <div class="field-label">封面帧</div>
          <div id="coverPick"></div>
        </div>
        <div class="fee-card">
          <div class="fee-row"><span>发行费</span><b class="num">0.0005 ETH</b></div>
          <div class="fee-row" id="genFeeRow"><span>生成费</span><b class="num">0.02 ETH</b></div>
          <div class="fee-row total"><span>合计</span><b class="num" id="feeTotal">0.0205 ETH</b></div>
        </div>
        <div class="inline-warn danger" id="paramErr"></div>
        <div class="nav-row">
          <button class="btn btn-ghost" onclick="goStep(1)">返回</button>
          <div class="spacer"></div>
          <button class="btn btn-primary" onclick="goStep(3)" id="toStep3">下一步</button>
        </div>
      </section>

      <!-- STEP 3 -->
      <section id="step3" class="hide">
        <div class="create-title">确认创建</div>
        <div class="create-desc">创建后无法修改名称与符号。</div>
        <div class="preview-card" id="previewCard"></div>
        <div class="inline-warn danger" id="createErr"></div>
        <div class="nav-row">
          <button class="btn btn-ghost" onclick="goStep(2)">返回</button>
          <div class="spacer"></div>
          <button class="btn btn-primary btn-lg" id="createBtn" onclick="doCreate()">确认创建</button>
        </div>
      </section>

      <!-- SUCCESS -->
      <section id="success" class="hide">
        <div class="success-wrap">
          <div class="success-ico">✓</div>
          <div class="success-title">已上架</div>
          <div class="success-desc">叙事已在市场上线，curve 已就绪。</div>
          <div class="success-card" id="successCard"></div>
          <div class="nav-row" style="justify-content:center">
            <button class="btn btn-primary" id="goMarket" onclick="location.href='launchpad.html'">查看市场</button>
            <button class="btn btn-ghost" id="goCoin" onclick="location.href='coin-detail.html?id='+lastCoinId">查看我的币</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="launch-coin.js"></script>
  <script src="launch-shell.js"></script>
  <script>
    // ============================================================
    //  创建向导
    // ============================================================
    var step = 1;
    var source = 'ai';
    var style = '古风';
    var genState = { poster: null, name: '', genFee: true };
    var lastCoinId = null;

    // 演示用 AI 叙事封面素材池
    var AI_COVERS = [
      'image/cover-zero-night.jpg', 'image/cover-pyramid.jpg', 'image/cover-survivor.jpg',
      'image/cover-candle.jpg', 'image/cover-allin.jpg', 'image/hero-bg-blur.jpg'
    ];
    var AI_VIDEOS = [
      'video/打斗视频.mp4', 'video/凤骨琉璃.mp4', 'video/我卸甲后天下大乱了.mp4', 'video/丞相府今日开饭.mp4'
    ];
    function pickCover() { return AI_COVERS[Math.floor(Math.random() * AI_COVERS.length)]; }
    function pickVideo() { return AI_VIDEOS[Math.floor(Math.random() * AI_VIDEOS.length)]; }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function refreshEthHint() {
      var el = document.getElementById('ethHint');
      if (!el) return;
      el.textContent = '可用 ' + (window.Launch ? Launch.fmtEth(Launch.USER.eth) : '');
    }

    function pickSource(s) {
      source = s;
      document.getElementById('srcAI').classList.toggle('on', s === 'ai');
      document.getElementById('srcWork').classList.toggle('on', s === 'work');
      document.getElementById('aiPanel').classList.toggle('show', s === 'ai');
      document.getElementById('workPanel').classList.toggle('show', s === 'work');
      validateStep1();
    }

    // 作品数据（读 localStorage「我的作品」约定 key，兼容现有发布流程）
    function myWorks() {
      var out = [];
      try {
        var drama = JSON.parse(localStorage.getItem('storyfun_my_dramas') || '[]');
        var video = JSON.parse(localStorage.getItem('storyfun_my_videos') || '[]');
        out = drama.concat(video);
      } catch (e) {}
      if (!out.length) {
        out = [
          { title: '凤骨琉璃', cover: 'image/fenggu_cover.jpg', kind: 'drama', views: '22.3万' },
          { title: '我卸甲后天下大乱了', cover: 'image/xiejia_cover.jpg', kind: 'drama', views: '18.6万' },
          { title: '丞相府今日开饭', cover: 'image/chengxiangfu_cover.jpg', kind: 'video', views: '9.4万' }
        ];
      }
      return out;
    }
    var pickedWork = null;
    function renderWorks() {
      var host = document.getElementById('workList');
      var works = myWorks();
      if (!works.length) { host.innerHTML = '<div class="work-empty">还没有作品，先去创作，或改用 AI 生成。</div>'; return; }
      host.innerHTML = works.map(function (w, i) {
        return '<div class="work-item" data-i="' + i + '" onclick="pickWork(' + i + ')">' +
          '<div class="work-cover"><img src="' + esc(w.cover || 'image/hero-bg-blur.jpg') + '" alt="" /></div>' +
          '<div class="work-info"><div class="work-title">' + esc(w.title || '未命名') + '</div>' +
          '<div class="work-meta">' + (w.kind === 'drama' ? '短剧' : '视频') + (w.views ? ' · ' + esc(w.views) + ' 播放' : '') + '</div></div>' +
          '<div class="work-check">✓</div></div>';
      }).join('');
    }
    function pickWork(i) {
      var works = myWorks();
      pickedWork = works[i];
      document.querySelectorAll('.work-item').forEach(function (el) { el.classList.remove('on'); });
      var items = document.querySelectorAll('.work-item');
      if (items[i]) items[i].classList.add('on');
      document.getElementById('toStep2').disabled = false;
    }

    // ============ AI 生成演出 ============
    var genTimerHandle = null;
    function startGen() {
      if (!window.Launch) return;
      var prompt = document.getElementById('aiPrompt').value.trim();
      var errEl = document.getElementById('genErr');
      if (!prompt) { errEl.textContent = '先描述一段叙事'; errEl.classList.add('show'); return; }
      if (Launch.USER.eth < 0.02) {
        errEl.textContent = '余额不足 · 点击右上角 ETH 领取测试币';
        errEl.classList.add('show');
        Launch.toast('余额不足', 'err');
        return;
      }
      errEl.classList.remove('show');
      // 扣费（原型模拟：仅校验不真扣——由 createCoin 统一扣）
      genState.prompt = prompt;
      runStage(prompt);
    }

    function runStage(prompt) {
      var stage = document.getElementById('genStage');
      var poster = document.getElementById('genPoster');
      stage.classList.add('show');
      poster.classList.remove('show');
      document.getElementById('genBtn').disabled = true;
      document.getElementById('genBtn').textContent = '生成中…';

      // 关键词
      var words = extractWords(prompt);
      var kws = document.getElementById('genKws');
      kws.innerHTML = words.map(function (w) { return '<span class="gen-kw">' + esc(w) + '</span>'; }).join('');
      var kwsEls = kws.querySelectorAll('.gen-kw');
      kwsEls.forEach(function (el, i) { el.style.animationDelay = (i * 0.12) + 's'; });

      var t0 = performance.now();
      var dur = 4000;
      function frame(now) {
        var p = Math.min(1, (now - t0) / dur);
        document.getElementById('genBar').style.width = (p * 100) + '%';
        var remain = Math.max(0, 15 * (1 - p));
        document.getElementById('genTimer').textContent = remain.toFixed(1);
        var cap = document.getElementById('genCaption');
        cap.textContent = p < 0.4 ? '解析提示词…' : p < 0.75 ? '渲染关键帧…' : '合成片段…';
        if (p < 1) { requestAnimationFrame(frame); }
        else { finishGen(); }
      }
      requestAnimationFrame(frame);
    }

    function extractWords(prompt) {
      // 简单分词：取 2~6 个有意义的片段
      var words = prompt.replace(/[，。,.!！?？\s]+/g, ' ').trim().split(' ').filter(Boolean);
      if (words.length <= 3) return words.length ? words : [prompt];
      // 按字数粗分
      var all = prompt.replace(/\s+/g, '');
      var out = [];
      var size = Math.ceil(all.length / 4);
      for (var i = 0; i < all.length; i += size) out.push(all.slice(i, i + size));
      return out.slice(0, 6);
    }

    function finishGen() {
      var cover = pickCover();
      var video = pickVideo();
      var poster = document.getElementById('genPoster');
      var tag = genState.prompt || '一段由 AI 生成的叙事';
      var suggestion = suggestName(tag);
      poster.innerHTML =
        '<div class="gen-poster-img"><img src="' + cover + '" alt=""></div>' +
        '<div><div class="gen-poster-name">' + esc(suggestion) + '</div>' +
        '<div class="gen-poster-tag">AI 叙事 · 15s · ' + esc(style) + '</div>' +
        '<div class="gen-poster-desc">' + esc(tag) + '</div></div>';
      poster.classList.add('show');
      document.getElementById('genBtn').disabled = false;
      document.getElementById('genBtn').textContent = '重新生成';
      genState.poster = { cover: cover, video: video, prompt: tag, style: style };
      // 带出建议名
      if (!document.getElementById('pName').value) {
        document.getElementById('pName').value = suggestion;
      }
      if (!document.getElementById('pTag').value) document.getElementById('pTag').value = tag;
      document.getElementById('toStep2').disabled = false;
      Launch.toast('叙事已生成', 'ok');
    }

    function suggestName(tag) {
      if (!tag) return '新叙事币';
      var out = tag.replace(/[，。,.!！?？\s]+/g, '').slice(0, 8);
      return out || '新叙事币';
    }

    // ============ 步骤流 ============
    function validateStep1() {
      var ok = source === 'work' ? !!pickedWork : !!genState.poster;
      document.getElementById('toStep2').disabled = !ok;
    }

    function goStep(n) {
      if (n === 2) {
        var ok = source === 'work' ? !!pickedWork : !!genState.poster;
        if (!ok) { Launch.toast(source === 'work' ? '先选择一部作品' : '先完成一次生成', 'err'); return; }
        if (!window.Launch || !Launch.isLoggedIn()) {
          openLoginModal();
          Launch.toast('登录后即可创建', 'warn');
          return;
        }
      }
      step = n;
      document.querySelectorAll('.step-dot').forEach(function (el) {
        var s = parseInt(el.getAttribute('data-step'), 10);
        el.classList.toggle('on', s === n);
        el.classList.toggle('done', s < n);
      });
      document.getElementById('step1').classList.toggle('hide', n !== 1);
      document.getElementById('step2').classList.toggle('hide', n !== 2);
      document.getElementById('step3').classList.toggle('hide', n !== 3);
      if (n === 2) setupStep2();
      if (n === 3) setupStep3();
      window.scrollTo(0, 0);
    }

    function setupStep2() {
      // 封面帧选择
      var host = document.getElementById('coverPick');
      var frames = (genState.poster ? [genState.poster.cover] : [])
        .concat(pickedWork ? [pickedWork.cover] : [])
        .concat([pickCover(), pickCover(), pickCover()]);
      frames = frames.filter(Boolean).slice(0, 4);
      host.innerHTML = '<div class="style-row">' + frames.map(function (f, i) {
        return '<img src="' + esc(f) + '" data-s="' + esc(f) + '" onclick="pickFrame(this)" style="width:72px;height:54px;border-radius:10px;object-fit:cover;border:2px solid transparent' + (i === 0 ? ';border-color:#0A0B0D' : '') + '" />';
      }).join('') + '</div>';
      genState.frame = frames[0];
      // 费用
      var genFee = genState.poster ? 0.02 : 0;
      document.getElementById('genFeeRow').style.display = genFee ? 'flex' : 'none';
      document.getElementById('feeTotal').textContent = (0.0005 + genFee).toFixed(4) + ' ETH';
      document.getElementById('paramErr').classList.remove('show');
    }
    function pickFrame(el) {
      genState.frame = el.getAttribute('data-s');
      document.querySelectorAll('#coverPick img').forEach(function (im) { im.style.borderColor = 'transparent'; });
      el.style.borderColor = '#0A0B0D';
    }

    function setupStep3() {
      var name = document.getElementById('pName').value.trim();
      var sym = document.getElementById('pSymbol').value.trim().toUpperCase();
      var tag = document.getElementById('pTag').value.trim();
      document.getElementById('previewCard').innerHTML =
        '<div class="preview-cover"><img src="' + esc(genState.frame || 'image/hero-bg-blur.jpg') + '" alt=""></div>' +
        '<div class="preview-body">' +
          '<div class="preview-name">' + esc(name || '—') + '<span class="preview-sym num">$' + esc(sym || '—') + '</span></div>' +
          '<div class="preview-tag">' + esc(tag || '—') + '</div>' +
          '<div class="preview-meta">' +
            '<div><span class="k">总量</span><span class="v num">10 亿</span></div>' +
            '<div><span class="k">叙事</span><span class="v">' + (source === 'ai' ? 'AI · 15s' : '我的作品') + '</span></div>' +
            '<div><span class="k">初始价</span><span class="v num">$0.0001</span></div>' +
          '</div>' +
        '</div>';
      document.getElementById('createErr').classList.remove('show');
    }

    function doCreate() {
      if (!window.Launch) return;
      var name = document.getElementById('pName').value.trim();
      var sym = document.getElementById('pSymbol').value.trim().toUpperCase();
      var tag = document.getElementById('pTag').value.trim();
      var err = document.getElementById('createErr');
      if (!name) { err.textContent = '请输入名称'; err.classList.add('show'); return; }
      if (!/^[A-Z0-9]{2,6}$/.test(sym)) { err.textContent = '符号需为 2–6 位字母或数字'; err.classList.add('show'); return; }
      var dup = (Launch.coins || []).some(function (c) { return c.symbol === sym; });
      if (dup) { err.textContent = '符号已被使用'; err.classList.add('show'); return; }

      var btn = document.getElementById('createBtn');
      btn.disabled = true; btn.textContent = '创建中…';

      setTimeout(function () {
        var sourceType = source;
        var coin = Launch.createCoin({
          name: name, symbol: sym, tagline: tag,
          cover: genState.frame || (sourceType === 'ai' ? genState.poster.cover : pickedWork.cover),
          video: genState.poster ? genState.poster.video : '',
          sourceType: sourceType,
          sourceTitle: sourceType === 'ai' ? 'AI 叙事 · 15s' : (pickedWork ? pickedWork.title : '')
        });
        // 若是 AI 叙事，同步生成一个「我的视频作品」（放 localStorage，供内容流引用）
        if (sourceType === 'ai' && genState.poster) {
          try {
            var vids = JSON.parse(localStorage.getItem('storyfun_my_videos') || '[]');
            vids.unshift({
              id: coin.id, title: name, cover: genState.poster.cover, video: genState.poster.video,
              kind: 'ai', desc: tag, coinId: coin.id, symbol: sym
            });
            localStorage.setItem('storyfun_my_videos', JSON.stringify(vids.slice(0, 40)));
          } catch (e) {}
        }
        lastCoinId = coin.id;
        document.getElementById('success').classList.remove('hide');
        document.getElementById('step3').classList.add('hide');
        document.querySelectorAll('.step-dot').forEach(function (el) { el.classList.add('done'); });
        document.getElementById('successCard').innerHTML =
          '<img src="' + esc(coin.cover) + '" alt="">' +
          '<div class="sc-body"><div class="sc-name">' + esc(coin.name) + '<span class="preview-sym num">$' + esc(coin.symbol) + '</span></div>' +
          '<div class="sc-sub">' + esc(coin.tagline || '') + '</div></div>';
        btn.disabled = false;
        Launch.toast('已创建并上架', 'ok');
        window.scrollTo(0, 0);
      }, 900);
    }

    // ============ 事件 ============
    document.addEventListener('click', function (e) {
      var chip = e.target.closest('.style-chip');
      if (chip) {
        document.querySelectorAll('.style-chip').forEach(function (c) { c.classList.remove('on'); });
        chip.classList.add('on');
        style = chip.getAttribute('data-s');
      }
    });
    document.addEventListener('input', function (e) {
      if (e.target && e.target.id === 'pTag') {
        var n = e.target.value.length;
        document.getElementById('pTagCount').textContent = n + ' / 60';
      }
    });

    window.onLaunchShellReady = function () {
      renderWorks();
      refreshEthHint();
      document.getElementById('aiPrompt').addEventListener('input', function () {
        document.getElementById('genErr').classList.remove('show');
      });
      // 从资产页复用 AI 叙事：自动填充并视为已生成
      var q = new URLSearchParams(window.location.search);
      var reuseRaw = q.get('reuse');
      if (reuseRaw) {
        try {
          var v = JSON.parse(decodeURIComponent(reuseRaw));
          if (v && v.title) {
            pickSource('ai');
            document.getElementById('aiPrompt').value = v.desc || v.title;
            genState.poster = { cover: v.cover || pickCover(), video: v.video || '', prompt: v.desc || v.title, style: style };
            var poster = document.getElementById('genPoster');
            poster.innerHTML =
              '<div class="gen-poster-img">' + (v.video ? '<video src="' + esc(v.video) + '" muted playsinline></video>' : '<img src="' + esc(v.cover) + '" alt="">') + '</div>' +
              '<div><div class="gen-poster-name">' + esc(v.title) + '</div>' +
              '<div class="gen-poster-tag">AI 叙事 · 15s（复用）</div>' +
              '<div class="gen-poster-desc">' + esc(v.desc || '') + '</div></div>';
            poster.classList.add('show');
            document.getElementById('genBtn').textContent = '重新生成';
            document.getElementById('genBtn').disabled = false;
            document.getElementById('pName').value = v.title;
            document.getElementById('pTag').value = v.desc || '';
            document.getElementById('toStep2').disabled = false;
          }
        } catch (e) {}
      }
    };
  </script>
</body>
</html>
