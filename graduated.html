<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>已毕业 · 发射台</title>
  <link rel="stylesheet" href="launch.css" />
  <style>
    /* ===== 已毕业 ===== */
    .gd-hero { padding: 30px 0 6px; }
    .gd-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
    .gd-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .gd-sub { font-size: 13px; color: var(--text-2); margin-top: 5px; }
    .gd-stat { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--text-2); }
    .gd-stat b { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -0.01em; }
    .gd-rule { font-size: 11.5px; color: var(--text-3); margin: 18px 0 4px; }

    .gd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(252px, 1fr)); gap: 18px; margin-top: 16px; }
    .gd-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      overflow: hidden; cursor: pointer; transition: transform .18s, box-shadow .18s, border-color .18s;
    }
    .gd-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(16,24,40,.08); border-color: var(--border-strong); }
    .gd-cover { position: relative; aspect-ratio: 16 / 10; background: var(--surface-2); overflow: hidden; }
    .gd-cover img, .gd-cover video { width: 100%; height: 100%; object-fit: cover; }
    .gd-badge {
      position: absolute; top: 12px; left: 12px; height: 24px; padding: 0 11px;
      border-radius: 999px; display: inline-flex; align-items: center; gap: 5px;
      background: #0E9F6E; color: #fff; font-size: 11px; font-weight: 700;
    }
    .gd-info { padding: 13px 15px 15px; }
    .gd-name { display: flex; align-items: baseline; gap: 7px; font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
    .gd-sym { font-size: 11px; color: var(--text-3); font-weight: 600; letter-spacing: .03em; }
    .gd-price-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .gd-price { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
    .gd-chg { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
    .gd-chg.up { background: rgba(22,199,132,.1); }
    .gd-chg.down { background: rgba(246,70,93,.08); }
    .gd-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: var(--text-2); margin-top: 9px; }
    .gd-meta b { font-weight: 600; color: var(--text); }
    .gd-foot { display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; color: var(--text-3); margin-top: 8px; }
    .gd-tip {
      display: flex; align-items: center; gap: 9px; margin-top: 22px;
      padding: 13px 16px; border-radius: 14px;
      background: #F4FBF7; border: 1px solid rgba(14,159,110,.25);
      font-size: 12.5px; color: #0F7A57; line-height: 1.6;
    }
    .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); margin-top: 16px; }
    .back-link:hover { color: var(--text); }
    .empty { text-align: center; padding: 80px 20px; }
    .empty-title { font-size: 15px; font-weight: 600; }
    .empty-desc { font-size: 13px; color: var(--text-2); margin: 6px 0 18px; }

    @media (max-width: 620px) {
      .gd-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="launch-header-host"></div>

  <main class="launch-shell">
    <div class="gd-hero">
      <div class="gd-head">
        <div>
          <div class="gd-title">已毕业</div>
          <div class="gd-sub">Tokens that cleared the graduation threshold.</div>
        </div>
        <div class="gd-stat">🎓 <b class="num" id="gdCount">0</b></div>
      </div>
    </div>

    <div class="gd-grid" id="gdGrid"></div>
    <div class="empty" id="gdEmpty" style="display:none">
      <div class="empty-icon">🎓</div>
      <div class="empty-title">还没有币毕业</div>
      <div class="empty-desc">curve 达到阈值后，第一个毕业的币会出现在这里</div>
    </div>

    <div class="gd-tip">
      <span>🔒</span>
      <span>毕业即上 Uniswap · 流动性永久锁定。已毕业币仍可在此继续交易（同池多入口）。</span>
    </div>

    <a class="back-link" href="launchpad.html">← 返回市场</a>
  </main>

  <script src="auth.js"></script>
  <script src="launch-coin.js"></script>
  <script src="launch-shell.js"></script>
  <script>
    var esc = function (s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    };
    function goCoin(id) { location.href = 'coin-detail.html?id=' + encodeURIComponent(id); }

    function render() {
      var gds = (Launch.coins || []).filter(function (c) { return c.graduated; });
      gds.sort(function (a, b) { return (b.gradAt || 0) - (a.gradAt || 0); });
      document.getElementById('gdCount').textContent = gds.length;
      var grid = document.getElementById('gdGrid');
      var empty = document.getElementById('gdEmpty');
      if (!gds.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
      empty.style.display = 'none';
      grid.innerHTML = gds.map(function (c) {
        var gradAgo = c.gradAt ? Launch.timeAgo(c.gradAt) + ' 前毕业' : '';
        return '' +
          '<div class="gd-card" onclick="goCoin(\'' + esc(c.id) + '\')">' +
            '<div class="gd-cover"><img src="' + esc(c.cover) + '" alt="" loading="lazy" />' +
              '<span class="gd-badge">🎓 已毕业</span></div>' +
            '<div class="gd-info">' +
              '<div class="gd-name">' + esc(c.name) + '<span class="gd-sym">$' + esc(c.symbol) + '</span></div>' +
              '<div class="gd-price-row"><span class="gd-price num">' + Launch.fmtPrice(c.priceUsd) + '</span>' +
                '<span class="gd-chg num ' + Launch.dirClass(c.change24h) + '">' + Launch.pct(c.change24h) + '</span></div>' +
              '<div class="gd-meta"><span>市值 <b class="num">' + Launch.fmtUsd(c.marketCap) + '</b></span>' +
                '<span>池 <b class="num">' + Launch.fmtUsd(c.poolUsd || 0) + '</b></span></div>' +
              '<div class="gd-foot"><span>' + Launch.fmtNum(c.holders) + ' 持有</span><span>' + gradAgo + '</span></div>' +
            '</div>' +
          '</div>';
      }).join('');
    }

    window.onLaunchShellReady = function () { render(); };
  </script>
</body>
</html>
