<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>发射台 · Story.fun</title>
  <link rel="stylesheet" href="launch.css" />
  <style>
    /* ===== 页面特有：市场 ===== */
    .market-hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 30px 0 18px; }
    .market-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .market-sub { font-size: 13px; color: var(--text-2); margin-top: 4px; }
    .market-data-link {
      display: inline-flex; align-items: center; gap: 6px;
      height: 34px; padding: 0 14px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
      font-size: 12.5px; font-weight: 600; text-decoration: none;
      transition: border-color .15s, color .15s;
    }
    .market-data-link:hover { border-color: var(--border-strong); color: var(--text); }

    .market-toolbar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 20px; }
    .toolbar-group { display: inline-flex; align-items: center; gap: 8px; }
    .sort-label { font-size: 11.5px; color: var(--text-3); font-weight: 500; }
    .toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .search-input {
      width: 240px; height: 36px; padding: 0 12px 0 34px;
      border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
      font-size: 13px; outline: none; color: var(--text);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' fill='none' stroke='%239CA3AF' stroke-width='2' stroke-linecap='round'%3E%3Ccircle cx='11' cy='11' r='8'/%3E%3Cpath d='M21 21l-4.35-4.35'/%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: 11px center; background-size: 15px;
    }
    .search-input:focus { border-color: var(--accent); }

    .coin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 18px; }
    .coin-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      overflow: hidden; cursor: pointer; position: relative;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .coin-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(16,24,40,.08); border-color: var(--border-strong); }

    /* 封面：内嵌圆角，hover 微放大 */
    .coin-cover-wrap { padding: 8px 8px 0; }
    .coin-cover { position: relative; aspect-ratio: 16 / 10; border-radius: 13px; background: var(--surface-2); overflow: hidden; }
    .coin-cover img, .coin-cover video { width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
    .coin-card:hover .coin-cover img, .coin-card:hover .coin-cover video { transform: scale(1.04); }
    .coin-cover::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,11,13,0) 55%, rgba(10,11,13,.05)); pointer-events: none; }
    .play-veil { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10,11,13,0); transition: background .2s; }
    .coin-card:hover .play-veil { background: rgba(10,11,13,.14); }
    .play-veil .play-ico {
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(10,11,13,.55); backdrop-filter: blur(3px);
      display: grid; place-items: center; opacity: 0; transition: opacity .2s;
    }
    .coin-card:hover .play-ico { opacity: 1; }

    /* 徽章：左上悬浮 */
    .coin-badge {
      position: absolute; top: 12px; left: 12px; z-index: 2;
      height: 22px; padding: 0 10px; border-radius: 999px;
      font-size: 11px; font-weight: 700; letter-spacing: .01em;
      display: inline-flex; align-items: center;
      background: rgba(255,255,255,.9); color: var(--text); backdrop-filter: blur(8px);
      box-shadow: 0 1px 4px rgba(16,24,40,.08);
    }
    .coin-badge.new { background: rgba(10,11,13,.85); color: #fff; }
    .coin-badge.grad { background: #0E9F6E; color: #fff; }

    /* 信息区 */
    .coin-info { padding: 13px 15px 14px; }
    .coin-name { display: flex; align-items: baseline; gap: 7px; font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
    .coin-sym { font-size: 11px; color: var(--text-3); font-weight: 600; letter-spacing: .03em; }

    .coin-price-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .coin-price { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
    .coin-chg {
      font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
      display: inline-flex; align-items: center;
    }
    .coin-chg.up { background: rgba(22,199,132,.1); }
    .coin-chg.down { background: rgba(246,70,93,.08); }

    .coin-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: var(--text-2); margin-top: 9px; }
    .coin-meta b { font-weight: 600; color: var(--text); }
    .coin-meta .mono { font-family: var(--mono); font-size: 11.5px; }
    .coin-foot { display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; color: var(--text-3); margin-top: 6px; }

    /* 毕业进度：底部极细条 */
    .coin-progress { height: 3px; border-radius: 3px; background: var(--accent-soft); margin-top: 11px; overflow: hidden; }
    .coin-progress i { display: block; height: 100%; background: var(--text); border-radius: 3px; }

    .toolbar-create {
      height: 36px; padding: 0 16px; border-radius: 999px; background: var(--accent);
      color: #fff; border: none; font-size: 13px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .toolbar-create:hover { opacity: .9; }

    @media (max-width: 900px) {
      .search-input { width: 100%; margin-top: 4px; }
      .toolbar-right { width: 100%; margin-left: 0; }
      .coin-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 520px) {
      .coin-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="launch-header-host"></div>

  <main class="launch-shell" id="marketApp">
    <div class="market-hero">
      <div>
        <div class="market-title">发射台</div>
        <div class="market-sub">短视频叙事的代币，在曲线与池之间成长。</div>
      </div>
      <a class="market-data-link" href="analytics.html">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
        数据
      </a>
    </div>

    <!-- 工具栏 -->
    <div class="market-toolbar">
      <div class="toolbar-group">
        <span class="sort-label">排序</span>
        <div class="pill-seg" id="sortSeg">
          <button data-s="recent" class="on">最近买入</button>
          <button data-s="newest">最新</button>
          <button data-s="oldest">最旧</button>
          <button data-s="marketcap">市值</button>
          <button data-s="volume">成交量</button>
        </div>
      </div>
      <div class="toolbar-group">
        <span class="sort-label">时间</span>
        <div class="pill-seg" id="timeSeg">
          <button data-t="all" class="on">全部</button>
          <button data-t="24h">24h</button>
          <button data-t="7d">7d</button>
        </div>
      </div>
      <div class="toolbar-group">
        <span class="sort-label">状态</span>
        <div class="pill-seg" id="filterSeg">
          <button data-f="all" class="on">全部</button>
          <button data-f="curve">未毕业</button>
          <button data-f="grad">已毕业</button>
        </div>
      </div>
      <div class="toolbar-right">
        <input class="search-input" id="coinSearch" placeholder="搜索币名、符号" autocomplete="off" />
        <button class="toolbar-create" onclick="location.href='launch.html'">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          创建
        </button>
      </div>
    </div>

    <!-- 币网格 -->
    <div class="coin-grid" id="coinGrid"></div>

    <div class="empty" id="emptyState" style="display:none">
      <div class="empty-icon">◎</div>
      <div class="empty-title">未找到匹配的币</div>
      <div class="empty-desc">换个关键词，或看看全部</div>
      <button class="btn btn-ghost" onclick="resetFilters()">查看全部</button>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="launch-coin.js"></script>
  <script src="launch-shell.js"></script>
  <script>
    // ============================================================
    //  市场页
    // ============================================================
    var state = { filter: 'all', sort: 'recent', time: 'all', q: '' };

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function cardHTML(c) {
      var badge = '';
      if (c.isNew && !c.graduated) badge = '<span class="coin-badge new">NEW</span>';
      else if (c.graduated) badge = '<span class="coin-badge grad">🎓 已毕业</span>';
      else if (c.progress > 0.8) badge = '<span class="coin-badge">距毕业 ' + Math.round(c.progress * 100) + '%</span>';
      else badge = '<span class="coin-badge">' + Math.round(c.progress * 100) + '%</span>';

      var progress = '';
      if (!c.graduated) {
        progress = '<div class="coin-progress"><i style="width:' + Math.round(Math.min(100, c.progress * 100)) + '%"></i></div>';
      }
      var lastBuyLine = c.lastBuyAt
        ? '<span>买入 ' + Launch.timeAgo(c.lastBuyAt) + '</span>'
        : '<span>—</span>';
      var media = '<img src="' + esc(c.cover) + '" alt="' + esc(c.name) + '" loading="lazy" />';
      var veil = c.video
        ? '<div class="play-veil"><div class="play-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></div></div>'
        : '';
      return '' +
        '<div class="coin-card" data-id="' + esc(c.id) + '" onclick="openCoin(\'' + esc(c.id) + '\')">' +
          '<div class="coin-cover-wrap">' +
            '<div class="coin-cover" data-video="' + esc(c.video || '') + '">' + media + veil + badge + '</div>' +
          '</div>' +
          '<div class="coin-info">' +
            '<div class="coin-name">' + esc(c.name) + '<span class="coin-sym">$' + esc(c.symbol) + '</span></div>' +
            '<div class="coin-price-row"><span class="coin-price num">' + Launch.fmtPrice(c.priceUsd) + '</span>' +
              '<span class="coin-chg num ' + Launch.dirClass(c.change24h) + '">' + Launch.pct(c.change24h) + '</span></div>' +
            '<div class="coin-meta"><span>市值 <b class="num">' + Launch.fmtUsd(c.marketCap) + '</b></span>' +
              '<span>量 <b class="num">' + Launch.fmtUsd(c.volumeUsd || 0) + '</b></span></div>' +
            progress +
            '<div class="coin-foot">' +
              '<span>' + Launch.fmtNum(c.holders) + ' 持有</span>' + lastBuyLine +
            '</div>' +
          '</div>' +
        '</div>';
    }

    function filtered() {
      var cutoff = state.time === '24h' ? Date.now() - 86400000
        : state.time === '7d' ? Date.now() - 7 * 86400000 : 0;
      var list = (Launch.coins || []).filter(function (c) {
        if (state.filter === 'curve' && c.graduated) return false;
        if (state.filter === 'grad' && !c.graduated) return false;
        // 时间窗：该窗口内有最近买入（或刚发行）视为活跃
        if (cutoff && !c.lastBuyAt) return false;
        if (cutoff && c.lastBuyAt < cutoff && c.launchedAt < cutoff) return false;
        if (state.q) {
          var hay = (c.name + ' ' + c.symbol).toLowerCase();
          if (hay.indexOf(state.q.toLowerCase()) === -1) return false;
        }
        return true;
      });
      list.sort(function (a, b) {
        if (state.sort === 'newest') return b.launchedAt - a.launchedAt;
        if (state.sort === 'oldest') return a.launchedAt - b.launchedAt;
        if (state.sort === 'marketcap') return b.marketCap - a.marketCap;
        if (state.sort === 'volume') return (b.volumeUsd || 0) - (a.volumeUsd || 0);
        // recent buys（默认）
        return (b.lastBuyAt || 0) - (a.lastBuyAt || 0);
      });
      return list;
    }

    function render() {
      var list = filtered();
      var grid = document.getElementById('coinGrid');
      var empty = document.getElementById('emptyState');
      if (!list.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
      empty.style.display = 'none';
      grid.innerHTML = list.map(cardHTML).join('');
    }

    function openCoin(id) {
      location.href = 'coin-detail.html?id=' + encodeURIComponent(id);
    }
    function resetFilters() {
      state.filter = 'all'; state.sort = 'recent'; state.time = 'all'; state.q = '';
      document.querySelectorAll('#filterSeg button, #sortSeg button, #timeSeg button').forEach(function (b) { b.classList.remove('on'); });
      document.querySelector('#filterSeg button[data-f="all"]').classList.add('on');
      document.querySelector('#sortSeg button[data-s="recent"]').classList.add('on');
      document.querySelector('#timeSeg button[data-t="all"]').classList.add('on');
      document.getElementById('coinSearch').value = '';
      render();
    }

    // hover 视频预览（封面 → 播放）
    function bindCoverHover() {
      document.getElementById('coinGrid').addEventListener('mouseover', function (e) {
        var cover = e.target.closest('.coin-cover');
        if (!cover || cover._v) return;
        var vid = cover.getAttribute('data-video');
        var img = cover.querySelector('img');
        if (!vid || !img) return;
        var v = document.createElement('video');
        v.src = vid; v.muted = true; v.loop = true; v.playsInline = true;
        v.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover';
        cover.appendChild(v); cover._v = true;
        v.play().catch(function () {});
      });
    }

    window.onLaunchShellReady = function () {
      render();
      bindCoverHover();
      document.getElementById('filterSeg').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-f]');
        if (!b) return;
        document.querySelectorAll('#filterSeg button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        state.filter = b.getAttribute('data-f');
        render();
      });
      document.getElementById('coinSearch').addEventListener('input', function (e) {
        state.q = e.target.value.trim();
        render();
      });
      document.getElementById('sortSeg').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-s]');
        if (!b) return;
        document.querySelectorAll('#sortSeg button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        state.sort = b.getAttribute('data-s');
        render();
      });
      document.getElementById('timeSeg').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-t]');
        if (!b) return;
        document.querySelectorAll('#timeSeg button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        state.time = b.getAttribute('data-t');
        render();
      });
    };
  </script>
</body>
</html>
