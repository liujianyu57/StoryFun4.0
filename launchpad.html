<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>发射台 · Story.fun</title>
  <link rel="stylesheet" href="launch.css" />
  <style>
    /* ===== 页面特有：市场 ===== */
    .market-toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
    .toolbar-sep { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }
    .sim-label { font-size: 12px; color: var(--text-3); font-weight: 600; }

    /* 阶段大字下划线页签：字 + 滑动粗线，无容器无填充（顶部呼吸带承托） */
    .stage-tabs {
      position: relative; display: flex; align-items: baseline; gap: 34px;
      margin: 30px 0 20px; border-bottom: 1px solid var(--border);
    }
    .stage-tab {
      display: inline-flex; align-items: center; gap: 9px; padding: 6px 2px 16px;
      border: none; background: none; cursor: pointer;
      font-size: 20px; font-weight: 800; letter-spacing: -0.02em;
      color: var(--text-2); margin-bottom: -1px;
      transition: color .15s;
    }
    .stage-tab:hover { color: var(--text); }
    .stage-tab.on { color: var(--text); }
    .st-cnt {
      min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px;
      background: var(--accent-soft); color: var(--text-2);
      font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
    }
    .stage-tab.on .st-cnt { background: var(--accent); color: #fff; }
    .stage-underline { position: absolute; bottom: -1px; height: 3px; background: var(--accent); border-radius: 3px; transition: left .22s cubic-bezier(.2,.8,.2,1), width .22s; }

    .toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .search-input {
      width: 240px; height: 36px; padding: 0 12px 0 34px;
      border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
      font-size: 13px; outline: none; color: var(--text);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' fill='none' stroke='%239CA3AF' stroke-width='2' stroke-linecap='round'%3E%3Ccircle cx='11' cy='11' r='8'/%3E%3Cpath d='M21 21l-4.35-4.35'/%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: 11px center; background-size: 15px;
    }
    .search-input:focus { border-color: var(--accent); }

    .coin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 18px; }
    .coin-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      overflow: hidden; cursor: pointer; position: relative;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .coin-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(16,24,40,.08); border-color: var(--border-strong); }

    /* 封面：内嵌圆角，hover 微放大 */
    .coin-cover-wrap { padding: 8px 8px 0; }
    .coin-cover { position: relative; aspect-ratio: 16 / 10; border-radius: 13px; background: var(--surface-2); overflow: hidden; }
    .coin-cover img, .coin-cover video { width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
    .coin-card:hover .coin-cover img, .coin-card:hover .coin-cover video { transform: scale(1.04); }
    .coin-cover::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,11,13,0) 55%, rgba(10,11,13,.05)); pointer-events: none; }
    .play-veil { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10,11,13,0); transition: background .2s; }
    .coin-card:hover .play-veil { background: rgba(10,11,13,.14); }
    .play-veil .play-ico {
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(10,11,13,.55); backdrop-filter: blur(3px);
      display: grid; place-items: center; opacity: 0; transition: opacity .2s;
    }
    .coin-card:hover .play-ico { opacity: 1; }

    /* 徽章：左上悬浮 */
    .coin-badge {
      position: absolute; top: 12px; left: 12px; z-index: 2;
      height: 22px; padding: 0 10px; border-radius: 999px;
      font-size: 11px; font-weight: 700; letter-spacing: .01em;
      display: inline-flex; align-items: center;
      background: rgba(255,255,255,.9); color: var(--text); backdrop-filter: blur(8px);
      box-shadow: 0 1px 4px rgba(16,24,40,.08);
    }
    .coin-badge.new { background: rgba(10,11,13,.85); color: #fff; }
    .coin-badge.grad { background: #0E9F6E; color: #fff; }

    /* 信息区：pons 信号语言 = 币名 + MC + 曲线进度 + 最近买家（无价格/涨跌/量/持有） */
    .coin-info { padding: 13px 15px 14px; }
    .coin-name { display: flex; align-items: baseline; gap: 7px; font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
    .coin-sym { font-size: 11px; color: var(--text-3); font-weight: 700; letter-spacing: .04em; }

    /* 市值：大号等宽 + MC 单位 */
    .coin-mc-row { display: flex; align-items: baseline; gap: 6px; margin-top: 9px; }
    .coin-mc { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
    .coin-mc-unit { font-size: 10px; font-weight: 800; color: var(--text-3); letter-spacing: .06em; }

    /* 曲线进度：细条 + 右侧精确百分比 */
    .coin-progress-row { display: flex; align-items: center; gap: 10px; margin-top: 11px; min-height: 15px; }
    .coin-progress { flex: 1; height: 4px; border-radius: 4px; background: var(--accent-soft); overflow: hidden; }
    .coin-progress i { display: block; height: 100%; background: var(--text); border-radius: 4px; }
    .coin-progress.grad i { background: #0E9F6E; }
    .coin-pct { font-size: 11px; font-weight: 800; color: var(--text-2); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; letter-spacing: -0.01em; }

    /* 已毕业状态行（占位与进度行等高） */
    .coin-state { display: flex; align-items: center; gap: 5px; margin-top: 11px; min-height: 15px; font-size: 11.5px; font-weight: 700; color: #0E9F6E; }
    .coin-state svg { flex-shrink: 0; }
    .coin-state-sub { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--text-3); }

    /* 最近买家：钱包 + 相对时间 */
    .coin-buyer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-3); }
    .coin-wallet { font-family: var(--mono); font-size: 11px; color: var(--text-2); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .coin-ago { font-variant-numeric: tabular-nums; flex-shrink: 0; }

    .toolbar-create {
      height: 36px; padding: 0 16px; border-radius: 999px; background: var(--accent);
      color: #fff; border: none; font-size: 13px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .toolbar-create:hover { opacity: .9; }

    /* 模拟成交后的卡片高亮 */
    .sim-flash { animation: simFlash 1s ease; }
    @keyframes simFlash {
      0% { box-shadow: 0 0 0 2px rgba(10,11,13,.28); background: rgba(10,11,13,.05); }
      100% { box-shadow: 0 0 0 0 rgba(10,11,13,0); background: var(--surface); }
    }

    @media (max-width: 900px) {
      .search-input { width: 100%; margin-top: 4px; }
      .toolbar-right { width: 100%; margin-left: 0; }
      .coin-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 520px) {
      .stage-tabs { gap: 22px; margin-top: 22px; }
      .stage-tab { gap: 7px; padding: 5px 2px 13px; font-size: 17px; }
      .st-cnt { min-width: 20px; height: 20px; padding: 0 6px; font-size: 10.5px; }
      .coin-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="launch-header-host"></div>

  <main class="launch-shell" id="marketApp">
    <!-- 阶段 Tab -->
    <div class="stage-tabs" id="stageTabs">
      <button class="stage-tab on" data-tab="live">
        <span class="st-name">进行中</span>
        <span class="st-cnt num" id="cntLive">0</span>
      </button>
      <button class="stage-tab" data-tab="near">
        <span class="st-name">临近毕业</span>
        <span class="st-cnt num" id="cntNear">0</span>
      </button>
      <button class="stage-tab" data-tab="grad">
        <span class="st-name">已毕业</span>
        <span class="st-cnt num" id="cntGrad">0</span>
      </button>
      <span class="stage-underline" id="stageUnderline"></span>
    </div>

    <!-- 工具栏 -->
    <div class="market-toolbar">
      <div class="pill-seg" id="sortSeg">
        <button data-s="recent" class="on">最近买入</button>
        <button data-s="newest">最新</button>
        <button data-s="oldest">最旧</button>
        <button data-s="marketcap">市值</button>
        <button data-s="volume">成交量</button>
      </div>
      <span class="toolbar-sep" id="toolbarSep"></span>
      <div class="pill-seg" id="timeSeg">
        <button data-t="all" class="on">全部</button>
        <button data-t="24h">24h</button>
        <button data-t="7d">7d</button>
      </div>
      <span class="toolbar-sep"></span>
      <span class="sim-label">模拟</span>
      <div class="pill-seg" id="simSeg" title="演示：模拟买卖活跃度（平静=关闭）">
        <button data-sim="calm" class="on">平静</button>
        <button data-sim="live">活跃</button>
        <button data-sim="hot">热闹</button>
      </div>
      <div class="toolbar-right">
        <input class="search-input" id="coinSearch" placeholder="搜索币名、符号" autocomplete="off" />
        <button class="toolbar-create" onclick="location.href='launch.html'">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          创建
        </button>
      </div>
    </div>

    <!-- 币网格 -->
    <div class="coin-grid" id="coinGrid"></div>

    <div class="empty" id="emptyState" style="display:none">
      <div class="empty-icon">◎</div>
      <div class="empty-title" id="emptyTitle">未找到匹配的币</div>
      <div class="empty-desc" id="emptyDesc">换个关键词，或看看全部</div>
      <button class="btn btn-ghost" onclick="resetFilters()">查看全部</button>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="launch-coin.js"></script>
  <script src="launch-shell.js"></script>
  <script>
    // ============================================================
    //  市场页
    // ============================================================
    var state = { tab: 'live', sort: 'recent', time: 'all', q: '' };

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // pons 信号语言卡片：币名 + $TICKER + MC + 曲线进度% + 最近买家（无价格/涨跌/量/持有数）
    function mcTxt(u) { return Launch.fmtUsd(u).replace(/\.0(K|M)$/, '$1'); } // $900.0K → $900K
    function pctText(p) {
      if (p == null) return '—';
      var v = (p * 100).toFixed(2);
      return v.replace(/\.?0+$/, '') + '%';   // 94.12% / 66.66% / 5%
    }
    function ponsCard(c) {
      var grad = !!c.graduated;
      var badge = c.isNew
        ? '<span class="coin-badge new">NEW</span>'
        : grad ? '<span class="coin-badge grad">已毕业</span>' : '';
      var media = '<img src="' + esc(c.cover) + '" alt="' + esc(c.name) + '" loading="lazy" />';
      var veil = c.video
        ? '<div class="play-veil"><div class="play-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></div></div>'
        : '';
      var mid;
      if (grad) {
        var gradTxt = c.gradAt ? Launch.timeAgo(c.gradAt) + ' 前' : '';
        mid = '<div class="coin-state">' +
                '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0E9F6E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' +
                '<span>公开池</span>' +
                (gradTxt ? '<span class="coin-state-sub">' + gradTxt + '</span>' : '') +
              '</div>';
      } else {
        var wp = Math.min(100, Math.max(0, (c.progress || 0) * 100)).toFixed(2);
        mid = '<div class="coin-progress-row">' +
                '<div class="coin-progress"><i style="width:' + wp + '%"></i></div>' +
                '<span class="coin-pct num">' + pctText(c.progress) + '</span>' +
              '</div>';
      }
      var buyer = c.buyerAddr
        ? '<span class="coin-wallet" title="最近买家">' + esc(c.buyerAddr) + '</span>'
        : '<span class="coin-wallet">—</span>';
      var ago = c.lastBuyAt ? '<span class="coin-ago">' + Launch.timeAgo(c.lastBuyAt) + ' 前</span>' : '';
      return '' +
        '<div class="coin-card' + (state.tab === 'near' ? ' is-near' : '') + '" data-id="' + esc(c.id) + '" onclick="openCoin(\'' + esc(c.id) + '\')">' +
          '<div class="coin-cover-wrap">' +
            '<div class="coin-cover" data-video="' + esc(c.video || '') + '">' + media + veil + badge + '</div>' +
          '</div>' +
          '<div class="coin-info">' +
            '<div class="coin-name">' + esc(c.name) + '<span class="coin-sym">$' + esc(c.symbol) + '</span></div>' +
            '<div class="coin-mc-row"><span class="coin-mc num">' + mcTxt(c.marketCap) + '</span>' +
              '<span class="coin-mc-unit">MC</span></div>' +
            mid +
            '<div class="coin-buyer">' + buyer + ago + '</div>' +
          '</div>' +
        '</div>';
    }

    function filtered() {
      var cutoff = state.time === '24h' ? Date.now() - 86400000
        : state.time === '7d' ? Date.now() - 7 * 86400000 : 0;
      var list = (Launch.coins || []).filter(function (c) {
        if (state.tab === 'grad') { if (!c.graduated) return false; }
        else { if (c.graduated) return false; }
        if (state.tab === 'near' && c.progress <= 0.7) return false;
        // 时间窗仅对 live/near 生效
        if (state.tab !== 'grad' && cutoff) {
          if (!c.lastBuyAt) return false;
          if (c.lastBuyAt < cutoff && c.launchedAt < cutoff) return false;
        }
        if (state.q) {
          var hay = (c.name + ' ' + c.symbol).toLowerCase();
          if (hay.indexOf(state.q.toLowerCase()) === -1) return false;
        }
        return true;
      });
      list.sort(function (a, b) {
        if (state.tab === 'grad') return (b.gradAt || 0) - (a.gradAt || 0);
        if (state.sort === 'newest') return b.launchedAt - a.launchedAt;
        if (state.sort === 'oldest') return a.launchedAt - b.launchedAt;
        if (state.sort === 'marketcap') return b.marketCap - a.marketCap;
        if (state.sort === 'volume') return (b.volumeUsd || 0) - (a.volumeUsd || 0);
        return (b.lastBuyAt || 0) - (a.lastBuyAt || 0);
      });
      return list;
    }

    function tabCounts() {
      var coins = Launch.coins || [];
      var live = coins.filter(function (c) { return !c.graduated; }).length;
      var near = coins.filter(function (c) { return !c.graduated && c.progress > 0.7; }).length;
      var grad = coins.filter(function (c) { return c.graduated; }).length;
      document.getElementById('cntLive').textContent = live;
      document.getElementById('cntNear').textContent = near;
      document.getElementById('cntGrad').textContent = grad;
    }

    function moveUnderline(btn) {
      var ul = document.getElementById('stageUnderline');
      if (ul && btn) {
        ul.style.left = btn.offsetLeft + 'px';
        ul.style.width = btn.offsetWidth + 'px';
      }
    }

    function setTab(t) {
      state.tab = t;
      document.querySelectorAll('.stage-tab').forEach(function (x) { x.classList.remove('on'); });
      var btn = document.querySelector('.stage-tab[data-tab="' + t + '"]');
      if (btn) btn.classList.add('on');
      // 工具栏可见性：grad tab 时间窗无意义，隐藏 time seg
      var hideTime = t === 'grad';
      document.getElementById('timeSeg').style.display = hideTime ? 'none' : '';
      document.getElementById('toolbarSep').style.display = hideTime ? 'none' : '';
      render();
      requestAnimationFrame(function () { moveUnderline(btn); });
    }

    function render() {
      var list = filtered();
      var grid = document.getElementById('coinGrid');
      var empty = document.getElementById('emptyState');
      if (!list.length) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        var labels = { live: '还没有进行中的币', near: '暂无临近毕业的币', grad: '还没有币毕业' };
        document.getElementById('emptyTitle').textContent = labels[state.tab] || '未找到匹配的币';
        document.getElementById('emptyDesc').textContent = state.q ? '换个关键词试试' : '晚点再来看看';
        return;
      }
      empty.style.display = 'none';
      grid.innerHTML = list.map(ponsCard).join('');
    }

    function openCoin(id) {
      location.href = 'coin-detail.html?id=' + encodeURIComponent(id);
    }
    function resetFilters() {
      state.sort = 'recent'; state.time = 'all'; state.q = '';
      document.querySelectorAll('#sortSeg button, #timeSeg button').forEach(function (b) { b.classList.remove('on'); });
      document.querySelector('#sortSeg button[data-s="recent"]').classList.add('on');
      document.querySelector('#timeSeg button[data-t="all"]').classList.add('on');
      document.getElementById('coinSearch').value = '';
      render();
    }

    // hover 视频预览（封面 → 播放）
    function bindCoverHover() {
      document.getElementById('coinGrid').addEventListener('mouseover', function (e) {
        var cover = e.target.closest('.coin-cover');
        if (!cover || cover._v) return;
        var vid = cover.getAttribute('data-video');
        var img = cover.querySelector('img');
        if (!vid || !img) return;
        var v = document.createElement('video');
        v.src = vid; v.muted = true; v.loop = true; v.playsInline = true;
        v.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover';
        cover.appendChild(v); cover._v = true;
        v.play().catch(function () {});
      });
    }

    window.onLaunchShellReady = function () {
      tabCounts();
      // 阶段 tab 切换
      document.getElementById('stageTabs').addEventListener('click', function (e) {
        var b = e.target.closest('.stage-tab');
        if (!b) return;
        setTab(b.getAttribute('data-tab'));
      });
      window.addEventListener('resize', function () {
        var btn = document.querySelector('.stage-tab.on');
        moveUnderline(btn);
      });
      render();
      bindCoverHover();
      // 初始下划线
      requestAnimationFrame(function () {
        var btn = document.querySelector('.stage-tab.on');
        moveUnderline(btn);
      });
      // 模拟活跃开关
      var simSeg = document.getElementById('simSeg');
      var syncSimSeg = function (lv) {
        simSeg.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-sim') === lv); });
      };
      syncSimSeg(Launch.simLevel());
      simSeg.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-sim]');
        if (!b) return;
        var lv = b.getAttribute('data-sim');
        Launch.setSimLevel(lv);
        syncSimSeg(lv);
        Launch.toast(lv === 'calm' ? '模拟已关闭' : '模拟活跃：' + (lv === 'live' ? '低频' : '高频'), 'ok');
      });
      // 模拟成交 → 定向刷新该卡片并按排序归位（GMGN 式跳动，不整页重建）
      Launch.simSubscribe(function (c) {
        var grid = document.getElementById('coinGrid');
        if (!grid) return;
        var list = filtered();
        tabCounts();
        var visible = list.some(function (x) { return x.id === c.id; });
        var old = grid.querySelector('.coin-card[data-id="' + c.id + '"]');
        if (visible && old) {
          var tmp = document.createElement('div');
          tmp.innerHTML = ponsCard(c);
          var fresh = tmp.firstChild;
          fresh.classList.add('sim-flash');
          old.replaceWith(fresh);
        } else if (visible) {
          render(); // 原来被过滤、模拟后进入视野（少见）
        } else {
          return;  // 成交币不在当前筛选视野，无需动 DOM
        }
        // 按 filtered 排序把现有卡片归位（appendChild 移动节点，不重建）
        var nodes = {};
        grid.querySelectorAll('.coin-card').forEach(function (n) { nodes[n.getAttribute('data-id')] = n; });
        var frag = document.createDocumentFragment();
        list.forEach(function (x) { if (nodes[x.id]) frag.appendChild(nodes[x.id]); });
        grid.appendChild(frag);
      });
      document.getElementById('coinSearch').addEventListener('input', function (e) {
        state.q = e.target.value.trim();
        render();
      });
      document.getElementById('sortSeg').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-s]');
        if (!b) return;
        document.querySelectorAll('#sortSeg button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        state.sort = b.getAttribute('data-s');
        render();
      });
      document.getElementById('timeSeg').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-t]');
        if (!b) return;
        document.querySelectorAll('#timeSeg button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        state.time = b.getAttribute('data-t');
        render();
      });
    };
  </script>
</body>
</html>
