<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据 · 发射台</title>
  <link rel="stylesheet" href="launch.css" />
  <style>
    /* ===== Analytics ===== */
    .an-hero { padding: 30px 0 6px; }
    .an-title { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .an-sub { font-size: 13.5px; color: var(--text-2); margin-top: 6px; line-height: 1.6; }
    .an-sub .an-sub2 { display: block; font-size: 12px; color: var(--text-3); margin-top: 4px; font-variant-numeric: tabular-nums; }
    .an-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap; }

    .an-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin: 22px 0 20px; }
    .an-stat { padding: 18px 20px; }
    .an-stat .k { font-size: 12px; color: var(--text-2); }
    .an-stat .v { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin-top: 8px; }
    .an-stat .d { font-size: 12.5px; margin-top: 9px; font-variant-numeric: tabular-nums; }
    .an-stat .d.down { color: #E5484D; }
    .an-stat .d.up { color: #0E9F6E; }
    .an-stat .d.na { color: var(--text-3); }
    .an-note { font-size: 12px; color: var(--text-3); margin-top: 22px; padding-top: 14px;
      border-top: 1px solid var(--border); line-height: 1.6; max-width: 720px; }

    .an-main { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 18px; align-items: start; }
    .seg-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .an-dune {
      display: inline-flex; align-items: center; gap: 6px; height: 34px;
      padding: 0 14px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); font-size: 12.5px; font-weight: 600;
      text-decoration: none; white-space: nowrap; transition: all .15s;
    }
    .an-dune:hover { border-color: var(--text); background: var(--accent-soft); }
    .an-dune svg { width: 14px; height: 14px; flex-shrink: 0; }
    .card-title { font-size: 14px; font-weight: 700; }
    .card-sub { font-size: 12px; color: var(--text-2); margin-top: 3px; }

    /* 趋势图 */
    .trend-svg { width: 100%; display: block; margin-top: 12px; }
    .trend-legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); margin-top: 6px; }
    .trend-head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .trend-peak { font-size: 11.5px; color: var(--text-3); font-weight: 600; }

    .note { font-size: 11.5px; color: var(--text-3); margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); line-height: 1.6; }

    @media (max-width: 980px) {
      .an-main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="launch-header-host"></div>

  <main class="launch-shell">
    <div class="an-hero">
      <div class="an-head">
        <div>
          <div class="an-title">Protocol analytics</div>
          <div class="an-sub">Independent onchain reporting for pons markets on Robinhood Chain.
            <span class="an-sub2 num" id="duneMeta">Dune updated —</span>
          </div>
        </div>
        <a class="an-dune" href="https://dune.com/adam_tehc/pons" target="_blank" rel="noopener" title="打开 pons 官方 Dune 链上数据看板">
          View on Dune
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>
        </a>
      </div>
    </div>

    <!-- 24h 数据（pons：三块 + Dune 数据说明） -->
    <div class="an-grid" id="statCards"></div>

    <div class="an-note">Data is supplied by Dune from indexed onchain activity. The 24h view uses the latest completed UTC day.</div>
  </main>

  <script src="auth.js"></script>
  <script src="launch-coin.js"></script>
  <script src="launch-shell.js"></script>
  <script>
    // ============================================================
    //  Analytics
    // ============================================================
    // ============================================================
    //  Protocol analytics（pons：Dune 提供的 24h 三块数据）
    //  数据取自本地演示引擎（确定性 mock），结构与文案对齐 pons
    // ============================================================
    function fmtK(n) {
      if (n == null || isNaN(n)) return '—';
      var a = Math.abs(n);
      if (a >= 1e12) return (n / 1e12).toFixed(2) + 'T';
      if (a >= 1e9) return (n / 1e9).toFixed(2) + 'B';
      if (a >= 1e6) return (n / 1e6).toFixed(2) + 'M';
      if (a >= 1e3) return (n / 1e3).toFixed(2) + 'K';
      return n.toLocaleString('en-US');
    }
    function fmtUsdShort(n) {
      if (n == null || isNaN(n)) return '—';
      if (Math.abs(n) >= 1000) return '$' + fmtK(n);
      return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 2 });
    }
    function pctLine(cur, prev) {
      if (prev == null || !(prev > 0) || cur == null) return { t: 'No prior-day baseline', c: 'na' };
      var p = ((cur - prev) / prev) * 100;
      var s = (p >= 0 ? '+' : '') + p.toFixed(1) + '% from prior day';
      return { t: s, c: p >= 0 ? 'up' : 'down' };
    }
    function renderStats() {
      var host = document.getElementById('statCards');
      if (!host) return;
      var a = Launch.analytics('24h');
      var volT = a.volTrend || [], lauT = a.trend || [];
      var curIdx = Math.max(0, volT.length - 2);   // 最近完整日 = 昨天（索引倒数第二）
      var preIdx = curIdx - 1;
      var volCur = volT[curIdx] ? volT[curIdx].value : 0;
      var volPre = preIdx >= 0 && volT[preIdx] ? volT[preIdx].value : null;
      var lauCur = lauT[curIdx] ? lauT[curIdx].value : 0;
      var lauPre = preIdx >= 0 && lauT[preIdx] ? lauT[preIdx].value : null;
      var trdCur = volCur != null ? Math.max(0, Math.round(volCur / 60)) : 0; // 演示：约 60$/笔
      var trdPre = volPre != null ? Math.max(0, Math.round(volPre / 60)) : null;
      var vd = pctLine(volCur, volPre);
      var ld = pctLine(lauCur, lauPre);
      var td = pctLine(trdCur, trdPre);
      var cards = [
        { k: '24h volume', v: fmtUsdShort(volCur), d: vd },
        { k: '24h launches', v: fmtK(lauCur), d: ld },
        { k: '24h trades', v: fmtK(trdCur), d: td }
      ];
      host.innerHTML = cards.map(function (c) {
        return '<div class="card an-stat">' +
          '<div class="k">' + c.k + '</div>' +
          '<div class="v num">' + c.v + '</div>' +
          '<div class="d ' + c.d.c + '">' + c.d.t + '</div>' +
        '</div>';
      }).join('');
    }

    function fillDuneMeta() {
      var el = document.getElementById('duneMeta');
      if (!el) return;
      try {
        var now = new Date();
        var t = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        var y = new Date(Date.now() - 86400000);
        var day = y.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
        el.textContent = 'Dune updated ' + t + ', latest complete day ' + day + ' UTC';
      } catch (e) { el.textContent = 'Dune updated —'; }
    }

    window.onLaunchShellReady = function () {
      fillDuneMeta();
      renderStats();
    };
  </script>
  <script src="load-desktop-header.js"></script>
  <script src="load-sidebar.js"></script>
  <script src="load-bottom-nav.js"></script>
</body>
</html>
